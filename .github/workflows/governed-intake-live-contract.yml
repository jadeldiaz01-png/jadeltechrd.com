name: Governed intake live contract

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  workflow_run:
    workflows: ['Deploy public site to GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-contract:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE: https://jadeltechrd.com
      API: https://intake.jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Verify governed intake public assets
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "$SITE/" \
            "$SITE/project-request.js" \
            "$SITE/project-request.css" \
            "$SITE/solicitar-proyecto.html"; do
            code=$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' \
              --connect-timeout 8 --max-time 20 --proto '=https' --tlsv1.2 "$url")
            echo "$url -> HTTP=$code"
            test "$code" = 200
            test -s /tmp/body
          done

          curl --fail --silent --show-error --output /tmp/intake.html "$SITE/solicitar-proyecto.html"
          curl --fail --silent --show-error --output /tmp/home.html "$SITE/"
          app_path=$(grep -oE '/app\.[0-9a-f]{40}\.js' /tmp/home.html | head -n1 || true)
          test -n "$app_path"
          curl --fail --silent --show-error --output /tmp/app.js "$SITE$app_path"

          ! grep -Fq '/project-intake-bridge.js' /tmp/home.html
          grep -Fq 'const INTAKE_PATH = "/solicitar-proyecto.html"' /tmp/app.js
          grep -Fq 'const governedIntakeUrl = (ids)' /tmp/app.js
          ! grep -Fq 'const directCheckout =' /tmp/app.js
          grep -Fq 'id="project-request-form"' /tmp/intake.html
          grep -Fq 'challenges.cloudflare.com/turnstile' /tmp/intake.html
          echo "PUBLIC_IMMUTABLE_APP=$app_path"
          echo 'PUBLIC_INTAKE_ASSETS=PASS'
          echo 'PUBLIC_SINGLE_OWNER_SOURCE=PASS'

      - name: Verify API health, CORS and public Turnstile config
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error --max-time 20 "$API/health")
          test "$(jq -r '.status' <<<"$health")" = ok
          test "$(jq -r '.write_mode' <<<"$health")" = fail-closed

          headers=$(mktemp)
          config=$(curl --fail --silent --show-error -D "$headers" \
            -H 'Origin: https://jadeltechrd.com' "$API/api/v1/public-config")
          test "$(jq -r '.turnstile_action' <<<"$config")" = project_request
          sitekey=$(jq -r '.turnstile_sitekey' <<<"$config")
          test -n "$sitekey" && test "$sitekey" != null
          test "$(jq -c 'keys | sort' <<<"$config")" = '["turnstile_action","turnstile_sitekey"]'
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$headers"

          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' \
            -H 'Origin: https://evil.example' "$API/api/v1/public-config")
          test "$bad" = 403

          preflight_headers=$(mktemp)
          preflight=$(curl -sS -o /dev/null -D "$preflight_headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://jadeltechrd.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,idempotency-key' \
            "$API/api/v1/project-requests")
          test "$preflight" = 204
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$preflight_headers"
          echo 'API_CORS_TURNSTILE_CONTRACT=PASS'

      - name: Install pinned Puppeteer and managed Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/jadel-browser-e2e"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          actual=$(node -p "require('puppeteer/package.json').version")
          test "$actual" = "$PUPPETEER_VERSION"
          echo "PUPPETEER_VERSION=PASS version=$actual"

      - name: Exercise single-owner governed CTA in real browser
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jadel-browser-e2e"
          SITE="$SITE" node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 60000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });
            try {
              const page = await browser.newPage();
              page.setDefaultTimeout(15000);
              await page.setCacheEnabled(false);
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(String(error)));
              await page.goto(process.env.SITE, { waitUntil: 'domcontentloaded', timeout: 20000 });
              await page.waitForSelector('[data-add-service="architecture"]', { visible: true });

              const scriptState = await page.evaluate(() => ({
                bridgeLoaded: [...document.scripts].some((script) => String(script.src).includes('project-intake-bridge.js')),
                immutableApps: [...document.scripts]
                  .map((script) => {
                    try { return new URL(script.src || '', window.location.origin).pathname; }
                    catch { return ''; }
                  })
                  .filter((pathname) => /^\/app\.[0-9a-f]{40}\.js$/.test(pathname)),
              }));
              assert.equal(scriptState.bridgeLoaded, false);
              assert.equal(scriptState.immutableApps.length, 1);

              await page.click('[data-add-service="architecture"]');
              await page.click('[data-add-service="support"]');
              await page.waitForFunction(() => document.querySelectorAll('[data-remove-service]').length === 2);

              const state = await page.evaluate(() => {
                const node = document.getElementById('request-payment');
                return {
                  text: node?.textContent?.trim(),
                  href: node?.getAttribute('href'),
                  governed: node?.dataset?.governedIntake,
                  target: node?.getAttribute('target'),
                };
              });
              assert.equal(state.text, 'Solicitar proyecto');
              assert.equal(state.governed, 'true');
              assert.equal(state.target, null);
              assert.ok(!String(state.href).startsWith('mailto:'));
              assert.ok(!String(state.href).startsWith('https://www.paypal.com'));
              const target = new URL(state.href, process.env.SITE);
              assert.equal(target.origin, process.env.SITE);
              assert.equal(target.pathname, '/solicitar-proyecto.html');
              assert.equal(target.searchParams.get('services'), 'architecture,support');
              assert.deepEqual(pageErrors, []);
              console.log('GOVERNED_CTA_SINGLE_OWNER_BROWSER_E2E=PASS');
              console.log('GOVERNED_CTA_IMMUTABLE_APP=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE

      - name: Verify intake page security policy
        shell: bash
        run: |
          set -euo pipefail
          page=$(curl --fail --silent --show-error "$SITE/solicitar-proyecto.html")
          grep -Fq "connect-src https://intake.jadeltechrd.com https://challenges.cloudflare.com" <<<"$page"
          grep -Fq "frame-src https://challenges.cloudflare.com" <<<"$page"
          grep -Fq "form-action 'none'" <<<"$page"
          grep -Fq 'Enviar solicitud segura' <<<"$page"
          grep -Fq 'no autoriza pagos' <<<"$page"
          echo 'INTAKE_SECURITY_POLICY=PASS'
