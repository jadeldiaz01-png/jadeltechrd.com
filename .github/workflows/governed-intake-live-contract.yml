name: Governed intake live contract

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  workflow_run:
    workflows: ['Deploy public site to GitHub Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-contract:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SITE: https://jadeltechrd.com
      API: https://intake.jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Verify governed intake public assets
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            "$SITE/" \
            "$SITE/project-intake-bridge.js" \
            "$SITE/project-request.js" \
            "$SITE/project-request.css" \
            "$SITE/solicitar-proyecto.html"; do
            code=$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' \
              --connect-timeout 8 --max-time 20 --proto '=https' --tlsv1.2 "$url")
            echo "$url -> HTTP=$code"
            test "$code" = 200
            test -s /tmp/body
          done
          curl --fail --silent --show-error --output /tmp/bridge.js "$SITE/project-intake-bridge.js"
          curl --fail --silent --show-error --output /tmp/intake.html "$SITE/solicitar-proyecto.html"
          curl --fail --silent --show-error --output /tmp/home.html "$SITE/"
          grep -Fq '/project-intake-bridge.js' /tmp/home.html
          grep -Fq '/solicitar-proyecto.html' /tmp/bridge.js
          grep -Fq 'id="project-request-form"' /tmp/intake.html
          grep -Fq 'challenges.cloudflare.com/turnstile' /tmp/intake.html
          echo 'PUBLIC_INTAKE_ASSETS=PASS'

      - name: Verify API health, CORS and public Turnstile config
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error --max-time 20 "$API/health")
          test "$(jq -r '.status' <<<"$health")" = ok
          test "$(jq -r '.write_mode' <<<"$health")" = fail-closed

          headers=$(mktemp)
          config=$(curl --fail --silent --show-error -D "$headers" \
            -H 'Origin: https://jadeltechrd.com' "$API/api/v1/public-config")
          test "$(jq -r '.turnstile_action' <<<"$config")" = project_request
          sitekey=$(jq -r '.turnstile_sitekey' <<<"$config")
          test -n "$sitekey" && test "$sitekey" != null
          test "$(jq -c 'keys | sort' <<<"$config")" = '["turnstile_action","turnstile_sitekey"]'
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$headers"

          bad=$(curl -sS -o /tmp/bad-origin.json -w '%{http_code}' \
            -H 'Origin: https://evil.example' "$API/api/v1/public-config")
          test "$bad" = 403

          preflight_headers=$(mktemp)
          preflight=$(curl -sS -o /dev/null -D "$preflight_headers" -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://jadeltechrd.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,idempotency-key' \
            "$API/api/v1/project-requests")
          test "$preflight" = 204
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$preflight_headers"
          echo 'API_CORS_TURNSTILE_CONTRACT=PASS'

      - name: Install pinned Puppeteer and managed Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/jadel-browser-e2e"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          actual=$(node -p "require('puppeteer/package.json').version")
          test "$actual" = "$PUPPETEER_VERSION"
          echo "PUPPETEER_VERSION=PASS version=$actual"
          node - <<'NODE'
          const puppeteer = require('puppeteer');
          console.log(`PUPPETEER_EXECUTABLE=${puppeteer.executablePath()}`);
          NODE

      - name: Exercise governed CTA bridge in controlled browser
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/jadel-browser-e2e"
          SITE="$SITE" node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 60000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });
            try {
              console.log(`BROWSER_VERSION=${await browser.version()}`);
              console.log(`BROWSER_EXECUTABLE=${await puppeteer.executablePath()}`);

              const probe = await browser.newPage();
              await probe.setContent('<button id="probe" onclick="window.__clicked=true">probe</button>');
              await probe.click('#probe');
              assert.equal(await probe.evaluate(() => window.__clicked), true);
              console.log('BROWSER_INPUT_PROBE=PASS');
              await probe.close();

              const page = await browser.newPage();
              page.setDefaultTimeout(15000);
              const pageErrors = [];
              page.on('pageerror', (error) => pageErrors.push(String(error)));
              const started = Date.now();
              await page.setContent(`
                <!doctype html>
                <html>
                  <head><base href="${process.env.SITE}/"></head>
                  <body>
                    <header class="site-header"><nav class="nav"></nav></header>
                    <main class="commercial-home">
                      <section id="servicios">
                        <button data-add-service="architecture">Architecture</button>
                        <button data-add-service="support">Support</button>
                        <div id="selected-services">
                          <button data-remove-service="architecture">Architecture</button>
                          <button data-remove-service="support">Support</button>
                        </div>
                        <strong id="estimate-setup">$1,150</strong>
                        <strong id="estimate-monthly">$149</strong>
                        <a id="request-payment" href="mailto:test@example.invalid">Solicitar alcance y pago</a>
                      </section>
                    </main>
                  </body>
                </html>`,
                { waitUntil: 'domcontentloaded', timeout: 20000 }
              );
              await page.addScriptTag({ content: fs.readFileSync('/tmp/bridge.js', 'utf8') });
              await page.waitForFunction(() => document.getElementById('request-payment')?.dataset?.governedIntake === 'true');

              const state = await page.evaluate(() => ({
                selected: document.querySelectorAll('[data-remove-service]').length,
                setup: document.getElementById('estimate-setup')?.textContent?.trim(),
                monthly: document.getElementById('estimate-monthly')?.textContent?.trim(),
                text: document.getElementById('request-payment')?.textContent?.trim(),
                href: document.getElementById('request-payment')?.getAttribute('href'),
                governed: document.getElementById('request-payment')?.dataset?.governedIntake,
                nav: document.querySelector('[data-intake-nav="true"]')?.getAttribute('href'),
              }));

              assert.equal(state.selected, 2);
              assert.equal(state.setup, '$1,150');
              assert.equal(state.monthly, '$149');
              assert.equal(state.text, 'Solicitar proyecto');
              assert.equal(state.governed, 'true');
              assert.match(state.href || '', /^\/solicitar-proyecto\.html\?services=/);
              assert.equal(state.nav, '/solicitar-proyecto.html');
              assert.ok(!String(state.href).startsWith('mailto:'));
              assert.deepEqual(pageErrors, []);

              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 10000 }),
                page.click('#request-payment'),
              ]);
              const destination = new URL(page.url());
              assert.equal(destination.origin, process.env.SITE);
              assert.equal(destination.pathname, '/solicitar-proyecto.html');
              const ids = new Set((destination.searchParams.get('services') || '').split(','));
              assert.deepEqual(ids, new Set(['architecture', 'support']));
              console.log(`GOVERNED_CTA_BRIDGE_MS=${Date.now() - started}`);
              console.log('GOVERNED_CTA_BROWSER_E2E=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify intake page security policy
        shell: bash
        run: |
          set -euo pipefail
          page=$(curl --fail --silent --show-error "$SITE/solicitar-proyecto.html")
          grep -Fq "connect-src https://intake.jadeltechrd.com https://challenges.cloudflare.com" <<<"$page"
          grep -Fq "frame-src https://challenges.cloudflare.com" <<<"$page"
          grep -Fq "form-action 'none'" <<<"$page"
          grep -Fq 'Enviar solicitud segura' <<<"$page"
          grep -Fq 'no autoriza pagos' <<<"$page"
          echo 'INTAKE_SECURITY_POLICY=PASS'
