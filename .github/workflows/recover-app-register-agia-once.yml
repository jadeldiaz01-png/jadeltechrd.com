name: Recover App and Register AGIA Once

on:
  push:
    branches:
      - 'ops/recover-app-register-72c3b3fb'
    paths:
      - '.github/workflows/recover-app-register-agia-once.yml'

permissions:
  contents: read

concurrency:
  group: recover-app-register-agia-once
  cancel-in-progress: false

jobs:
  recover-register:
    name: Recover GitHub App env and register AGIA certifier
    runs-on: [self-hosted, linux, x64, jadel-agent-runtime]
    timeout-minutes: 12
    environment: production-bootstrap
    env:
      EXPECTED_WEB_MAIN: '72c3b3fb183a988c59de3d5af54484c6c6e0db26'
      EXPECTED_RUNTIME_MAIN: '44b201eb63b09c6d81e3b364a861f64e5771de54'
      EXPECTED_REGISTER_BLOB: '0decb69b8937315b367c32added539a21f3df239'
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce exact lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_WEB_MAIN"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/recover-app-register-agia-once.yml'
          echo "RECOVERY_REGISTER_LINEAGE=PASS"
          echo "RUNTIME_SOURCE_SHA=$EXPECTED_RUNTIME_MAIN"

      - name: Materialize immutable REGISTER_ONLY
        shell: bash
        env:
          REGISTER_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$REGISTER_B64" | base64 -d > "$RUNNER_TEMP/register-only.sh"
          chmod 700 "$RUNNER_TEMP/register-only.sh"
          test "$(git hash-object "$RUNNER_TEMP/register-only.sh")" = "$EXPECTED_REGISTER_BLOB"
          bash -n "$RUNNER_TEMP/register-only.sh"
          grep -Fq 'RUNNER_HOME="/opt/actions-runners/agia-production-certifier"' "$RUNNER_TEMP/register-only.sh"
          ! grep -Fq -- '--replace' "$RUNNER_TEMP/register-only.sh"
          ! grep -Fq 'svc.sh' "$RUNNER_TEMP/register-only.sh"
          ! grep -Fq 'systemctl ' "$RUNNER_TEMP/register-only.sh"
          echo "REGISTER_ONLY_PAYLOAD_INTEGRITY=PASS"

      - name: Prepare self Tailscale SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          case "$VPS_USER" in root) echo "refusing root SSH login" >&2; exit 1;; esac
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_PRIVATE_KEY_PASSPHRASE"
          test "$(tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))')" = Running
          TAILSCALE_IP="$(tailscale ip -4 | head -n1)"
          [[ "$TAILSCALE_IP" =~ ^100\. ]]
          printf 'TAILSCALE_IP=%s\n' "$TAILSCALE_IP" >> "$GITHUB_ENV"
          test -r /etc/ssh/ssh_host_ed25519_key.pub
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519"
          awk -v host="$TAILSCALE_IP" '{print host" "$1" "$2}' /etc/ssh/ssh_host_ed25519_key.pub > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ssh/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY_PASSPHRASE:?}"
          ASKPASS
          chmod 0700 "$RUNNER_TEMP/ssh/askpass"
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/ssh/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$RUNNER_TEMP/ssh/id_ed25519" </dev/null >/dev/null
          echo "RECOVERY_REGISTER_TAILSCALE_SSH=PASS"

      - name: Recover GitHub App env from existing protected key
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP" 'bash -s' <<'REMOTE'
          set -euo pipefail
          key=/etc/agia/secrets/github-app-jit.pem
          envfile=/etc/agia/github-app.env
          sudo -n test -s "$key" || { echo "GITHUB_APP_PRIVATE_KEY=ABSENT"; exit 51; }
          meta="$(sudo -n stat -c "%U:%G %a %s" "$key")"
          owner_group="$(awk "{print \$1}" <<<"$meta")"
          mode="$(awk "{print \$2}" <<<"$meta")"
          size="$(awk "{print \$3}" <<<"$meta")"
          test "$owner_group" = "root:root"
          test "$mode" = "400"
          test "$size" -gt 0
          echo "GITHUB_APP_PRIVATE_KEY_PRESENT=PASS"
          echo "GITHUB_APP_PRIVATE_KEY_METADATA=PASS"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"; unset INSTALL_TOKEN REG_TOKEN REG_JSON API_DATA' EXIT HUP INT TERM
          cat > "$tmp" <<'ENV'
          GITHUB_APP_ID=5040368
          GITHUB_APP_INSTALLATION_ID=163928265
          GITHUB_APP_PRIVATE_KEY_FILE=/etc/agia/secrets/github-app-jit.pem
          ENV
          chmod 600 "$tmp"
          sudo -n install -d -o root -g root -m 0755 /etc/agia
          sudo -n install -o root -g root -m 0640 "$tmp" "$envfile"
          test "$(sudo -n stat -c "%U:%G %a" "$envfile")" = "root:root 640"
          echo "GITHUB_APP_ENV_RECOVERY=PASS"

          INSTALL_TOKEN="$(sudo -n /usr/local/sbin/agia-github-app-installation-token print-installation-token)"
          test -n "$INSTALL_TOKEN"
          echo "GITHUB_APP_HELPER_RECOVERED=PASS"

          code="$(curl -sS -o /tmp/agia-registration-probe.json -w "%{http_code}" -X POST             -H "Authorization: Bearer $INSTALL_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/jadeldiaz01-png/universal-multi-project-runtime/actions/runners/registration-token")"
          test "$code" = "201"
          rm -f /tmp/agia-registration-probe.json
          echo "GITHUB_APP_REGISTRATION_TOKEN_ENDPOINT=PASS"
          REMOTE

      - name: Clean stale stage and upload REGISTER_ONLY
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP" 'set -euo pipefail
            id runtime-gateway-deploy >/dev/null
            sudo -n -u runtime-gateway-deploy true
            sudo -n -u runtime-gateway-deploy bash -c "sudo -n -l /usr/local/sbin/agia-runner-bootstrap >/dev/null"
            p=/tmp/bootstrap_agia_production_runner.sh
            if [ -e "$p" ]; then
              test ! -L "$p"
              owner="$(stat -c %U "$p")"
              caller="$(id -un)"
              case "$owner" in
                "$caller") rm -f "$p" ;;
                runtime-gateway-deploy) sudo -n -u runtime-gateway-deploy rm -f "$p" ;;
                *) echo "unexpected staged file owner=$owner" >&2; exit 41 ;;
              esac
            fi
            test ! -e "$p"
          '
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "sudo -n -u runtime-gateway-deploy sh -c 'cat > /tmp/bootstrap_agia_production_runner.sh && chmod 700 /tmp/bootstrap_agia_production_runner.sh'"             < "$RUNNER_TEMP/register-only.sh"
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "test \"\$(stat -c '%U:%G %a' /tmp/bootstrap_agia_production_runner.sh)\" = 'runtime-gateway-deploy:runtime-gateway-deploy 700'"
          echo "REGISTER_ONLY_STAGED=PASS"

      - name: Mint ephemeral token and REGISTER_ONLY
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          cat > "$RUNNER_TEMP/remote-register.sh" <<'REMOTE'
          #!/usr/bin/env bash
          set -euo pipefail
          INSTALL_TOKEN="$(sudo -n /usr/local/sbin/agia-github-app-installation-token print-installation-token)"
          trap 'unset INSTALL_TOKEN REG_TOKEN REG_JSON API_DATA' EXIT HUP INT TERM
          REG_JSON="$(curl -fsS -X POST             -H "Authorization: Bearer $INSTALL_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/jadeldiaz01-png/universal-multi-project-runtime/actions/runners/registration-token")"
          REG_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$REG_JSON")"
          test -n "$REG_TOKEN"
          unset REG_JSON
          printf '%s\n' "$REG_TOKEN" | sudo -n -u runtime-gateway-deploy bash -c 'sudo -n /usr/local/sbin/agia-runner-bootstrap'
          unset REG_TOKEN

          INSTALL_TOKEN="$(sudo -n /usr/local/sbin/agia-github-app-installation-token print-installation-token)"
          API_DATA="$(curl -fsS             -H "Authorization: Bearer $INSTALL_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/jadeldiaz01-png/universal-multi-project-runtime/actions/runners?per_page=100")"
          python3 -c 'import json,sys,socket; d=json.load(sys.stdin); n=socket.gethostname().split(".")[0]+"-agia-production-certifier"; r=next((x for x in d.get("runners",[]) if x.get("name")==n),None); assert r is not None,n; labels={x.get("name") for x in r.get("labels",[])}; assert "agia-production-certifier" in labels,labels; print("AGIA_RUNNER_API_REGISTERED=PASS"); print("AGIA_RUNNER_API_STATUS="+str(r.get("status"))); print("AGIA_RUNNER_API_BUSY="+str(r.get("busy")).lower())' <<<"$API_DATA"
          REMOTE
          chmod 700 "$RUNNER_TEMP/remote-register.sh"

          set +e
          out="$("${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP" 'bash -s' < "$RUNNER_TEMP/remote-register.sh")"
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          grep -qx 'AGIA_PRODUCTION_RUNNER_REGISTER_ONLY=PASS' <<<"$out"
          grep -qx 'RUNNER_LABEL=agia-production-certifier' <<<"$out"
          grep -qx 'LEGACY_JADEL_AGENT_RUNTIME_PRESERVED=PASS' <<<"$out"
          grep -qx 'P4H_PRESERVED=PASS' <<<"$out"
          grep -qx 'RUNNER_SERVICE_INSTALL_PERFORMED=NO' <<<"$out"
          grep -qx 'RUNNER_SERVICE_START_PERFORMED=NO' <<<"$out"
          grep -qx 'AGIA_RUNNER_API_REGISTERED=PASS' <<<"$out"
          echo "AGIA_REGISTER_AFTER_APP_RECOVERY=PASS"

      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -rf "$RUNNER_TEMP/ssh"
          rm -f "$RUNNER_TEMP/register-only.sh" "$RUNNER_TEMP/remote-register.sh"
