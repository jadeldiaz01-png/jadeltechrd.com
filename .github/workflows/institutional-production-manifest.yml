name: institutional-production-manifest

on:
  pull_request:
    paths:
      - "config/institutional-production-manifest-2026.json"
      - "config/institutional-production-manifest-2026.schema.json"
      - "scripts/validate-institutional-production-manifest.mjs"
      - ".github/workflows/institutional-production-manifest.yml"
      - ".github/workflows/commercial-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "config/institutional-production-manifest-2026.json"
      - "config/institutional-production-manifest-2026.schema.json"
      - "scripts/validate-institutional-production-manifest.mjs"
      - ".github/workflows/institutional-production-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-production-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate institutional manifest
        run: node scripts/validate-institutional-production-manifest.mjs

      - name: Verify referenced domain manifests exist
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            config/site-production-readiness-2026.json \
            config/agent-production-manifest.json \
            config/agent-production-readiness.json \
            config/slo-policy.json \
            security/api-security-manifest.json; do
            test -s "$path"
          done
          echo 'DOMAIN_MANIFEST_REFERENCES=PASS'

      - name: Verify baseline SHA exists
        shell: bash
        run: |
          set -euo pipefail
          sha=$(node -p "require('./config/institutional-production-manifest-2026.json').baseline_sha")
          git cat-file -e "${sha}^{commit}"
          echo "INSTITUTIONAL_BASELINE_SHA=PASS ${sha}"

      - name: Verify no secret-like material in public manifest
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '(sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|client_secret[" ]*:[" ]*[A-Za-z0-9_-]{16,}|api[_-]?token[" ]*:[" ]*[A-Za-z0-9_-]{16,})' config/institutional-production-manifest-2026.json; then
            echo 'Secret-like material detected in institutional manifest' >&2
            exit 1
          fi
          echo 'INSTITUTIONAL_MANIFEST_SECRET_SCAN=PASS'

      - name: Enforce fail-closed critical domains
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m = require('./config/institutional-production-manifest-2026.json');
          if (m.decision.execution_enabled_by_default !== false) throw new Error('execution must default off');
          if (m.decision.live_financial_capital_authorized !== false) throw new Error('live capital must remain closed');
          if (m.domain_authorization.quant_and_trading.live_capital_authorized !== false) throw new Error('quant live capital must remain closed');
          if (m.decision.autonomous_external_publication_authorized !== false) throw new Error('autonomous publication must remain closed');
          console.log('INSTITUTIONAL_FAIL_CLOSED=PASS');
          NODE
