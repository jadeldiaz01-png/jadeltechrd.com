name: institutional-production-manifest

on:
  pull_request:
    paths:
      - "config/institutional-production-manifest-2026.json"
      - "config/institutional-production-manifest-2026.schema.json"
      - "config/site-production-readiness-2026.json"
      - "config/revenue-intelligence-control-plane-2026.json"
      - "config/revenue-model-registry-2026.json"
      - "config/revenue-agent-spec-2026.json"
      - "scripts/validate-institutional-production-manifest.mjs"
      - ".github/workflows/institutional-production-manifest.yml"
      - ".github/workflows/commercial-live-smoke.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/d1-recovery-drill-readiness.yml"
      - ".github/workflows/d1-recovery-drill-execute.yml"
      - ".github/workflows/provision-d1-recovery-drill.yml"
      - ".github/workflows/site-slo-evidence.yml"
      - ".github/workflows/site-slo-daily-rollup.yml"
      - ".github/workflows/site-slo-certifier.yml"
      - ".github/workflows/slo-alert-path-test.yml"
      - "scripts/build-site-slo-daily-rollup.mjs"
      - "scripts/certify-site-slo.mjs"
      - "scripts/test-site-slo-certifier.mjs"
      - "config/slo-policy.json"
      - "docs/PRODUCTION-READINESS-2026.md"
      - "docs/operations/D1-RECOVERY-DRILL-2026.md"
  push:
    branches: [main]
    paths:
      - "config/institutional-production-manifest-2026.json"
      - "config/institutional-production-manifest-2026.schema.json"
      - "config/site-production-readiness-2026.json"
      - "config/revenue-intelligence-control-plane-2026.json"
      - "config/revenue-model-registry-2026.json"
      - "config/revenue-agent-spec-2026.json"
      - "scripts/validate-institutional-production-manifest.mjs"
      - ".github/workflows/institutional-production-manifest.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/d1-recovery-drill-readiness.yml"
      - ".github/workflows/d1-recovery-drill-execute.yml"
      - ".github/workflows/site-slo-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: institutional-production-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Validate institutional manifest
        run: node scripts/validate-institutional-production-manifest.mjs

      - name: Verify referenced domain manifests exist
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            config/site-production-readiness-2026.json \
            config/agent-production-manifest.json \
            config/agent-production-readiness.json \
            config/revenue-intelligence-control-plane-2026.json \
            config/revenue-model-registry-2026.json \
            config/revenue-agent-spec-2026.json \
            config/slo-policy.json \
            security/api-security-manifest.json; do
            test -s "$path"
          done
          echo 'DOMAIN_MANIFEST_REFERENCES=PASS'

      - name: Verify baseline SHA exists
        shell: bash
        run: |
          set -euo pipefail
          sha=$(node -p "require('./config/institutional-production-manifest-2026.json').baseline_sha")
          git cat-file -e "${sha}^{commit}"
          echo "INSTITUTIONAL_BASELINE_SHA=PASS ${sha}"

      - name: Verify no secret-like material in public manifest
        shell: bash
        run: |
          set -euo pipefail
          if grep -Ein '(sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|client_secret[" ]*:[" ]*[A-Za-z0-9_-]{16,}|api[_-]?token[" ]*:[" ]*[A-Za-z0-9_-]{16,})' config/institutional-production-manifest-2026.json; then
            echo 'Secret-like material detected in institutional manifest' >&2
            exit 1
          fi
          echo 'INSTITUTIONAL_MANIFEST_SECRET_SCAN=PASS'

      - name: Enforce fail-closed critical domains
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m = require('./config/institutional-production-manifest-2026.json');
          if (m.decision.execution_enabled_by_default !== false) throw new Error('execution must default off');
          if (m.decision.live_financial_capital_authorized !== false) throw new Error('live capital must remain closed');
          if (m.domain_authorization.quant_and_trading.live_capital_authorized !== false) throw new Error('quant live capital must remain closed');
          if (m.decision.autonomous_external_publication_authorized !== false) throw new Error('autonomous publication must remain closed');
          if (m.domain_authorization.revenue_intelligence.production_authorized !== false) throw new Error('revenue intelligence production must remain closed');
          if (m.domain_authorization.revenue_intelligence.autonomous_external_actions_authorized !== false) throw new Error('revenue intelligence external autonomy must remain closed');
          if (m.domain_authorization.revenue_intelligence.max_unapproved_ad_spend_usd !== 0) throw new Error('revenue intelligence unapproved ad spend must remain zero');
          console.log('INSTITUTIONAL_FAIL_CLOSED=PASS');
          NODE

      - name: Test SLO certifier fixtures
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-site-slo-certifier.mjs
          echo 'SLO_CERTIFIER_FIXTURES=PASS'

      - name: Parse critical workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path); puts "WORKFLOW_YAML_PARSE=PASS #{path}" }' \
            .github/workflows/pages.yml \
            .github/workflows/d1-recovery-drill-readiness.yml \
            .github/workflows/d1-recovery-drill-execute.yml \
            .github/workflows/provision-d1-recovery-drill.yml \
            .github/workflows/site-slo-evidence.yml \
            .github/workflows/site-slo-daily-rollup.yml \
            .github/workflows/site-slo-certifier.yml \
            .github/workflows/slo-alert-path-test.yml

      - name: Verify promotion and recovery workflows stay fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'attestations: write' .github/workflows/pages.yml
          grep -Fq 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6' .github/workflows/pages.yml
          grep -Fq 'gh attestation verify' .github/workflows/pages.yml
          grep -Fq 'CycloneDX' .github/workflows/pages.yml
          grep -Fq 'READ_ONLY_RECOVERY_CHECK' .github/workflows/d1-recovery-drill-readiness.yml
          grep -Fq 'test "$DRILL_DATABASE_NAME" != "jadel-commercial-runtime"' .github/workflows/d1-recovery-drill-readiness.yml
          ! grep -Eq 'd1[[:space:]]+time-travel[[:space:]]+restore' .github/workflows/d1-recovery-drill-readiness.yml
          grep -Fq 'name: d1-recovery-drill' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'CLOUDFLARE_D1_API_TOKEN' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq '/user/tokens/verify' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq '/tokens/verify' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'cfat_' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'cfut_' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'CLOUDFLARE_D1_TOKEN_VERIFY=PASS' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'D1_RECOVERY_DRILL_ENV_READY' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'jadel-commercial-runtime-recovery-drill' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq '/d1/database' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq '/time_travel/bookmark' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'D1_STAGE_A=PASS' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'D1_STAGE_A_ATTESTATION_VERIFY=PASS' .github/workflows/provision-d1-recovery-drill.yml
          ! grep -Eq '/time_travel/restore|DELETE.*d1/database' .github/workflows/provision-d1-recovery-drill.yml
          grep -Fq 'CLOUDFLARE_D1_API_TOKEN' .github/workflows/d1-recovery-drill-readiness.yml
          grep -Fq 'D1_RECOVERY_DRILL_ENV_READY' .github/workflows/d1-recovery-drill-readiness.yml
          grep -Fq 'DESTROY_RECOVERY_DRILL_ONLY' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'CLOUDFLARE_D1_API_TOKEN' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'D1_RECOVERY_DRILL_ENV_READY' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'environment:' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'name: d1-recovery-drill' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'ALLOW_D1_RECOVERY_DRILL' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq '*-recovery-drill' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'jadel-commercial-runtime' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq '/time_travel/restore?bookmark=' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'previous_bookmark' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'RESTORE_ROLLBACK_DRILL=PASS' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'gh attestation verify' .github/workflows/d1-recovery-drill-execute.yml
          grep -Fq 'cron: "7,17,27,37,47,57 * * * *"' .github/workflows/site-slo-evidence.yml
          grep -Fq 'first_attempt_no_retry' .github/workflows/site-slo-evidence.yml
          ! grep -Fq -- '--retry' .github/workflows/site-slo-evidence.yml
          grep -Fq 'SLO_FIRST_ATTEMPT_NO_RETRY=PASS' .github/workflows/site-slo-evidence.yml
          grep -Fq 'SLO_ALERT_DELIVERY_GITHUB_ISSUE=PASS' .github/workflows/site-slo-evidence.yml
          grep -Fq 'SITE_SLO_DAILY_ROLLUP' scripts/build-site-slo-daily-rollup.mjs
          grep -Fq 'site-slo-evidence.yml/runs' .github/workflows/site-slo-daily-rollup.yml
          grep -Fq 'SLO_ERROR_BUDGET_ALERTING' scripts/certify-site-slo.mjs
          grep -Fq 'minimum_coverage_ratio' scripts/certify-site-slo.mjs
          grep -Fq 'maximum_gap_minutes' scripts/certify-site-slo.mjs
          grep -Fq 'multiwindow_burn_rate_rules' scripts/certify-site-slo.mjs
          grep -Fq 'long_window' scripts/certify-site-slo.mjs
          grep -Fq 'short_window' scripts/certify-site-slo.mjs
          grep -Fq 'multiwindow_multi_burn_rate' config/slo-policy.json
          grep -Fq 'site-slo-daily-rollup.yml/runs' .github/workflows/site-slo-certifier.yml
          grep -Fq 'slo-alert-path-test.yml/runs' .github/workflows/site-slo-certifier.yml
          grep -Fq 'SLO_30D_ATTESTATION_VERIFY=PASS' .github/workflows/site-slo-certifier.yml
          grep -Fq 'SLO_ALERT_CREATE_READ_COMMENT_CLOSE=PASS' .github/workflows/slo-alert-path-test.yml
          grep -Fq 'SLO_ALERT_ATTESTATION_VERIFY=PASS' .github/workflows/slo-alert-path-test.yml
          grep -Fq 'measurement_window_days' config/slo-policy.json
          grep -Fq 'expected_slots_per_window' config/slo-policy.json
          grep -Fq 'maximum_gap_minutes' config/slo-policy.json
          echo 'PROMOTION_RECOVERY_FAIL_CLOSED=PASS'
