name: Revenue Funnel v1 gate

on:
  pull_request:
    branches: [main]
    paths:
      - "config/revenue-funnel-v1.json"
      - "docs/revenue/REVENUE-FUNNEL-V1.md"
      - "revenue-funnel.js"
      - "revenue-funnel.css"
      - "whatsapp-ia-empresas-rd.html"
      - "automatizacion-procesos-ia-rd.html"
      - "agente-ventas-ia-rd.html"
      - "solicitar-proyecto.html"
      - "project-request.js"
      - "sitemap.xml"
      - ".github/workflows/revenue-funnel-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Revenue Funnel contract
        run: |
          set -euo pipefail
          node --check revenue-funnel.js
          node --check project-request.js
          node scripts/validate-revenue-funnel-v1.mjs
          for page in whatsapp-ia-empresas-rd.html automatizacion-procesos-ia-rd.html agente-ventas-ia-rd.html; do
            grep -Fq 'Content-Security-Policy' "$page"
            grep -Fq 'rel="canonical"' "$page"
            grep -Fq 'data-revenue-event="offer_cta_click"' "$page"
          done
          grep -Fq 'offer_id=whatsapp_support&service_id=support' whatsapp-ia-empresas-rd.html
          grep -Fq 'offer_id=automation_blueprint&service_id=architecture' automatizacion-procesos-ia-rd.html
          grep -Fq 'offer_id=sales_lead_intelligence&service_id=sales' agente-ventas-ia-rd.html
          grep -Fq 'params.get("offer_id")' revenue-funnel.js
          grep -Fq 'params.get("service_id")' revenue-funnel.js
          echo "REVENUE_ATTRIBUTION_PROPAGATION=PASS"
          echo "REVENUE_FUNNEL_GATE=PASS"
