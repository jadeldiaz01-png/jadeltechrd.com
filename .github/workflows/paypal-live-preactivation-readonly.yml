name: Audit PayPal LIVE preactivation (GET-only)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full protected main SHA to audit (40 lowercase hex chars)
        type: string
        required: true
      expected_version_prefix:
        description: First 8 hexadecimal characters of the version observed in Cloudflare
        type: string
        required: true
      confirmation:
        description: Type AUDIT_PAYPAL_LIVE_PREACTIVATION_READONLY
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: jadel-paypal-live-preactivation-readonly
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'AUDIT_PAYPAL_LIVE_PREACTIVATION_READONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: d1-live-readonly-audit
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_VERSION_PREFIX: ${{ inputs.expected_version_prefix }}
      WORKER_NAME: jadel-commercial-runtime
      CLOUDFLARE_READONLY_TOKEN_RAW: ${{ secrets.CLOUDFLARE_D1_READONLY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact protected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Read active deployment and verify fail-closed flags (no financial actions)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo PREACTIVATION_SHA=INVALID >&2; exit 2; }
          [[ "$EXPECTED_VERSION_PREFIX" =~ ^[0-9a-fA-F]{8}$ ]] || { echo PREACTIVATION_VERSION_PREFIX=INVALID >&2; exit 2; }
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"

          token=$(printf '%s' "${CLOUDFLARE_READONLY_TOKEN_RAW:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID_RAW:-}" | tr -d '\r\n[:space:]')
          test -n "$token" || { echo PREACTIVATION_READONLY_TOKEN=MISSING >&2; exit 3; }
          [[ "$account" =~ ^[0-9a-fA-F]{32}$ ]] || { echo PREACTIVATION_ACCOUNT=INVALID >&2; exit 3; }
          echo "::add-mask::$token"

          auth=(-H "Authorization: Bearer $token" -H 'Accept: application/json')
          api="https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/$WORKER_NAME"
          response_file="$RUNNER_TEMP/paypal-readonly-response.json"
          cf_get() {
            local url="$1"
            local stage="$2"
            local status
            status=$(curl --silent --show-error --max-time 20 --output "$response_file" --write-out '%{http_code}' "${auth[@]}" "$url") || {
              echo "PREACTIVATION_$stage=TRANSPORT_ERROR" >&2; exit 4;
            }
            if [ "$status" != 200 ] || ! jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
              echo "PREACTIVATION_$stage=HTTP_OR_PROVIDER_ERROR status=$status" >&2; exit 4;
            fi
          }

          cf_get "https://api.cloudflare.com/client/v4/accounts/$account/tokens/verify" TOKEN
          jq -e '.result.status == "active"' "$response_file" >/dev/null || {
            echo PREACTIVATION_TOKEN=INACTIVE >&2; exit 4;
          }
          cf_get "$api/deployments?per_page=1" DEPLOYMENT
          jq -e '(.result.deployments | length) == 1 and (.result.deployments[0].versions | length) == 1 and (.result.deployments[0].versions[0].percentage == 100)' "$response_file" >/dev/null || {
            echo PREACTIVATION_TRAFFIC=AMBIGUOUS >&2; exit 5;
          }
          deployment_id=$(jq -r '.result.deployments[0].id' "$response_file")
          version_id=$(jq -r '.result.deployments[0].versions[0].version_id' "$response_file")
          [[ "$version_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo PREACTIVATION_VERSION=INVALID >&2; exit 5; }
          [[ "${version_id,,}" == "${EXPECTED_VERSION_PREFIX,,}"* ]] || {
            echo PREACTIVATION_VERSION=DOES_NOT_MATCH_SCREENSHOT >&2; exit 5;
          }
          echo PREACTIVATION_ACTIVE_VERSION_PREFIX_MATCH=PASS

          cf_get "$api/versions/$version_id" VERSION
          jq -e '(.result.resources.bindings | type) == "array"' "$response_file" >/dev/null || {
            echo PREACTIVATION_BINDINGS=INVALID >&2; exit 6;
          }
          bindings=$(jq -c '.result.resources.bindings' "$response_file")
          failed=0
          for entry in \
            PAYPAL_ENVIRONMENT:live \
            PAYPAL_ORDER_CREATION_ENABLED:false \
            PAYPAL_LIVE_ORDER_CREATION_ENABLED:false \
            PAYPAL_AUTOMATIC_CAPTURE_ENABLED:false \
            PAYPAL_AUTOMATIC_RECONCILIATION_ENABLED:false \
            PAYPAL_AUTOMATIC_CAPTURE_MAX_MINOR:0 \
            PRODUCTION_AUTHORIZED:false \
            FINANCIAL_EXECUTION_AUTHORIZED:false \
            PAYPAL_SUBSCRIPTIONS_ENABLED:false \
            MAX_AUTONOMOUS_CAPITAL_USD:0; do
            name=${entry%%:*}
            expected=${entry#*:}
            count=$(jq -r --arg n "$name" '[.[] | select(.name == $n)] | length' <<<"$bindings")
            state=PASS
            if [ "$count" = 0 ]; then
              state=ABSENT
            elif [ "$count" != 1 ]; then
              state=DUPLICATE
            else
              kind=$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0].type // empty' <<<"$bindings")
              if [ "$kind" != plain_text ]; then
                state=WRONG_TYPE
              else
                actual=$(jq -r --arg n "$name" '[.[] | select(.name == $n)][0].text // "__UNSET__"' <<<"$bindings")
                [ "$actual" = "$expected" ] || state=WRONG_VALUE
              fi
            fi
            echo "PREACTIVATION_FLAG name=$name result=$state" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$state" = PASS ] || failed=1
          done
          for name in PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET PAYPAL_WEBHOOK_ID; do
            count=$(jq -r --arg n "$name" '[.[] | select(.name == $n and .type == "secret_text")] | length' <<<"$bindings")
            if [ "$count" != 1 ]; then
              echo "PREACTIVATION_SECRET name=$name result=NOT_CONFIRMED" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
            else
              echo "PREACTIVATION_SECRET name=$name result=PRESENT_ONLY" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          cf_get "$api/deployments?per_page=1" DEPLOYMENT_RECHECK
          new_deployment_id=$(jq -r '.result.deployments[0].id // empty' "$response_file")
          test "$new_deployment_id" = "$deployment_id" || {
            echo PREACTIVATION_DEPLOYMENT_CHANGED=FAIL >&2; exit 7;
          }
          [ "$failed" -eq 0 ] || { echo PREACTIVATION_FAIL_CLOSED_AUDIT=FAIL >&2; exit 8; }
          echo PREACTIVATION_FAIL_CLOSED_AUDIT=PASS
          echo PREACTIVATION_FINANCIAL_OPERATIONS=NONE
          echo PREACTIVATION_CREDENTIAL_IDENTITY_MATCH=NOT_PROVEN
          echo WORKER_CONFIGURATION_OPERATION=GET_ONLY
