name: Apply single-owner intake refactor

on:
  push:
    branches: [feat/single-owner-governed-intake]
    paths: ['.github/workflows/apply-single-owner-refactor.yml']

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/single-owner-governed-intake
          fetch-depth: 0
      - name: Apply deterministic refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(app, '  const DATA_DELETION_URL = "/?view=data-deletion";\n', '  const DATA_DELETION_URL = "/?view=data-deletion";\n  const INTAKE_PATH = "/solicitar-proyecto.html";\n  const SERVICE_ID_PATTERN = /^[a-z0-9-]{1,64}$/;\n  const MAX_INTAKE_SERVICES = 8;\n', 'constants')

          marker = '  }).format(value);\n\n  const paymentLabel = {'
          insertion = '  }).format(value);\n\n  const governedIntakeUrl = (ids) => {\n    const safeIds = [...new Set(ids)]\n      .filter((id) => SERVICE_ID_PATTERN.test(id || ""))\n      .slice(0, MAX_INTAKE_SERVICES);\n    if (!safeIds.length) return INTAKE_PATH;\n    const params = new URLSearchParams({ services: safeIds.join(",") });\n    return `${INTAKE_PATH}?${params.toString()}`;\n  };\n\n  const paymentLabel = {'
          app = replace_once(app, marker, insertion, 'governedIntakeUrl')

          old_lines = [
              '      if (requestPayment) {',
              '        const disabled = chosen.length === 0;',
              '        const directCheckout = chosen.length === 1 ? chosen[0].paymentLinks?.setup : "";',
              '        requestPayment.classList.toggle("is-disabled", disabled);',
              '        requestPayment.setAttribute("aria-disabled", String(disabled));',
              '        requestPayment.textContent = directCheckout ? "Pagar servicio con PayPal" : "Solicitar alcance y pago";',
              '        requestPayment.href = disabled ? "#pagos" : directCheckout || `mailto:${CONTACT_EMAIL}?subject=${encodeURIComponent("Solicitud Nexus Jadel Tech RD")}&body=${encodeURIComponent(buildBrief(chosen, setup, monthly))}`;',
              '        if (directCheckout) {',
              '          requestPayment.setAttribute("target", "_blank");',
              '          requestPayment.setAttribute("rel", "noopener noreferrer");',
              '        } else {',
              '          requestPayment.removeAttribute("target");',
              '          requestPayment.removeAttribute("rel");',
              '        }',
              '      }',
          ]
          new_lines = [
              '      if (requestPayment) {',
              '        const disabled = chosen.length === 0;',
              '        const ids = chosen.map((service) => service.id);',
              '        requestPayment.classList.toggle("is-disabled", disabled);',
              '        requestPayment.setAttribute("aria-disabled", String(disabled));',
              '        requestPayment.setAttribute("data-governed-intake", "true");',
              '        requestPayment.textContent = disabled ? "Selecciona servicios para solicitar proyecto" : "Solicitar proyecto";',
              '        requestPayment.href = disabled ? "#servicios" : governedIntakeUrl(ids);',
              '        requestPayment.removeAttribute("target");',
              '        requestPayment.removeAttribute("rel");',
              '      }',
          ]
          app = replace_once(app, '\n'.join(old_lines) + '\n', '\n'.join(new_lines) + '\n', 'legacy CTA')

          old_listeners = '\n'.join([
              '    selectedContainer?.addEventListener("click", (event) => {',
              '      const button = event.target.closest("[data-remove-service]");',
              '      if (!button) return;',
              '      selected.delete(button.dataset.removeService);',
              '      renderEstimate();',
              '    });',
              '',
              '    document.querySelectorAll("[data-filter]").forEach((button) => {',
          ])
          new_listeners = '\n'.join([
              '    selectedContainer?.addEventListener("click", (event) => {',
              '      const button = event.target.closest("[data-remove-service]");',
              '      if (!button) return;',
              '      selected.delete(button.dataset.removeService);',
              '      renderEstimate();',
              '    });',
              '',
              '    requestPayment?.addEventListener("click", (event) => {',
              '      if (selected.size > 0) return;',
              '      event.preventDefault();',
              '      document.getElementById("servicios")?.scrollIntoView({ behavior: "smooth", block: "start" });',
              '    });',
              '',
              '    renderEstimate();',
              '',
              '    document.querySelectorAll("[data-filter]").forEach((button) => {',
          ])
          app = replace_once(app, old_listeners, new_listeners, 'initial render')

          nav = '      <a href="/#gobernanza" data-home-nav>Seguridad</a>\n      <a href="/?view=privacy" data-nav="privacy">Privacidad</a>\n'
          nav_new = '      <a href="/#gobernanza" data-home-nav>Seguridad</a>\n      <a href="/solicitar-proyecto.html" data-intake-nav="true">Solicitar proyecto</a>\n      <a href="/?view=privacy" data-nav="privacy">Privacidad</a>\n'
          app = replace_once(app, nav, nav_new, 'intake nav')

          if 'const directCheckout =' in app:
              raise SystemExit('legacy direct checkout remains')
          app_path.write_text(app, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = replace_once(index, '  <script src="/project-intake-bridge.js" defer></script>\n', '', 'bridge script')
          index_path.write_text(index, encoding='utf-8')

          bridge = Path('project-intake-bridge.js')
          if not bridge.exists():
              raise SystemExit('bridge missing before refactor')
          bridge.unlink()

          Path('.github/workflows/apply-single-owner-refactor.yml').unlink()
          PY

          git diff --check
          node --check app.js
          test ! -e project-intake-bridge.js
          ! grep -Fq '/project-intake-bridge.js' index.html
          ! grep -Fq 'const directCheckout =' app.js
          grep -Fq 'requestPayment.href = disabled ? "#servicios" : governedIntakeUrl(ids);' app.js
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make governed intake configurator single-owner'
          git push origin HEAD:feat/single-owner-governed-intake
