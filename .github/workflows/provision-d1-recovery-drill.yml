name: Provision D1 recovery drill and Stage A

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-d1-recovery-drill.yml"
  workflow_dispatch:

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: d1-recovery-drill-provision
  cancel-in-progress: false

jobs:
  provision-and-stage-a:
    environment:
      name: jadeltechrd
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DOMAIN: jadeltechrd.com
      TOKEN_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      TOKEN_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      TOKEN_CF_TOKEN: ${{ secrets.CF_TOKEN }}
      TARGET_DATABASE_NAME: jadel-commercial-runtime-recovery-drill

    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select D1-capable Cloudflare credential and provision target
        id: provision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          selected_token=""
          selected_account=""
          selected_alias=""
          selected_database_id=""
          selected_action=""

          aliases=(CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN)

          for alias in "${aliases[@]}"; do
            env_name="TOKEN_${alias}"
            raw="${!env_name:-}"
            [ -n "$raw" ] || continue

            token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
            if [[ "$token" == \"*\" && "$token" == *\" ]]; then
              token="${token:1:${#token}-2}"
            elif [[ "$token" == \'*\' && "$token" == *\' ]]; then
              token="${token:1:${#token}-2}"
            fi
            [ -n "$token" ] || continue
            echo "::add-mask::$token"

            zone_tmp=$(mktemp)
            zone_code=$(curl -sS -o "$zone_tmp" -w '%{http_code}'               -H "Authorization: Bearer $token"               "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN&status=active&per_page=50" || true)

            if [ "$zone_code" != "200" ]; then
              echo "CLOUDFLARE_CANDIDATE alias=$alias zone_http=$zone_code d1_http=not_checked"
              continue
            fi

            account_id=$(jq -r --arg d "$DOMAIN" '.result[] | select(.name==$d) | .account.id // empty' "$zone_tmp" | head -n1)
            if [ -z "$account_id" ]; then
              echo "CLOUDFLARE_CANDIDATE alias=$alias zone_http=200 account_context=missing"
              continue
            fi
            echo "::add-mask::$account_id"

            list_tmp=$(mktemp)
            list_code=$(curl -sS -o "$list_tmp" -w '%{http_code}' --get               -H "Authorization: Bearer $token"               --data-urlencode "name=$TARGET_DATABASE_NAME"               "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database" || true)

            if [ "$list_code" != "200" ] || [ "$(jq -r '.success // false' "$list_tmp" 2>/dev/null || echo false)" != "true" ]; then
              echo "CLOUDFLARE_CANDIDATE alias=$alias zone_http=200 d1_list_http=$list_code"
              continue
            fi

            count=$(jq '.result | length' "$list_tmp")
            if [ "$count" -gt 1 ]; then
              echo "Multiple D1 databases unexpectedly matched the exact recovery-drill name." >&2
              exit 1
            fi

            if [ "$count" -eq 1 ]; then
              database_id=$(jq -r '.result[0].uuid // empty' "$list_tmp")
              action=existing
              cp "$list_tmp" evidence/database-list.json
            else
              request=$(jq -n --arg name "$TARGET_DATABASE_NAME" '{name:$name}')
              create_tmp=$(mktemp)
              create_code=$(curl -sS -o "$create_tmp" -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer $token"                 -H "Content-Type: application/json"                 --data "$request"                 "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database" || true)

              if [ "$create_code" != "200" ] || [ "$(jq -r '.success // false' "$create_tmp" 2>/dev/null || echo false)" != "true" ]; then
                echo "CLOUDFLARE_CANDIDATE alias=$alias zone_http=200 d1_list_http=200 d1_create_http=$create_code"
                continue
              fi

              database_id=$(jq -r '.result.uuid // empty' "$create_tmp")
              action=created
              cp "$list_tmp" evidence/database-list.json
              cp "$create_tmp" evidence/database-create.json
            fi

            case "$database_id" in
              ????????-????-????-????-????????????) ;;
              *)
                echo "Cloudflare did not return a UUID-shaped D1 database id." >&2
                exit 1
                ;;
            esac

            selected_token="$token"
            selected_account="$account_id"
            selected_alias="$alias"
            selected_database_id="$database_id"
            selected_action="$action"
            break
          done

          if [ -z "$selected_token" ]; then
            echo "D1_CAPABLE_CLOUDFLARE_TOKEN=NO" >&2
            echo "Required Cloudflare permission: D1 Write for the account containing $DOMAIN." >&2
            exit 7
          fi

          echo "::add-mask::$selected_token"
          echo "::add-mask::$selected_account"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$selected_token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$selected_account" >> "$GITHUB_ENV"
          printf '%s\n' "$selected_database_id" > /tmp/d1-database-id.txt
          printf '%s\n' "$selected_action" > /tmp/d1-provision-action.txt

          echo "database_id=$selected_database_id" >> "$GITHUB_OUTPUT"
          echo "provision_action=$selected_action" >> "$GITHUB_OUTPUT"
          echo "D1_CAPABLE_CLOUDFLARE_TOKEN=PASS alias=$selected_alias"
          echo "D1_RECOVERY_DATABASE_PROVISIONED=PASS action=$selected_action name=$TARGET_DATABASE_NAME"

      - name: Verify exact D1 identity and production backend
        shell: bash
        run: |
          set -euo pipefail
          database_id=$(cat /tmp/d1-database-id.txt)

          response=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$database_id")
          printf '%s\n' "$response" > evidence/database-get.json

          test "$(jq -r '.success' evidence/database-get.json)" = "true"
          test "$(jq -r '.result.name // empty' evidence/database-get.json)" = "$TARGET_DATABASE_NAME"
          test "$(jq -r '.result.uuid // empty' evidence/database-get.json)" = "$database_id"

          version=$(jq -r '.result.version // empty' evidence/database-get.json)
          test "$version" = "production"

          echo "D1_RECOVERY_DATABASE_IDENTITY=PASS"
          echo "D1_VERSION=production"

      - name: Execute Stage A Time Travel capability check
        shell: bash
        run: |
          set -euo pipefail
          database_id=$(cat /tmp/d1-database-id.txt)

          response=$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$database_id/time_travel/bookmark")
          printf '%s\n' "$response" > evidence/time-travel-bookmark.json

          test "$(jq -r '.success' evidence/time-travel-bookmark.json)" = "true"
          bookmark=$(jq -r '.result.bookmark // empty' evidence/time-travel-bookmark.json)
          test -n "$bookmark"

          bookmark_sha256=$(printf '%s' "$bookmark" | sha256sum | awk '{print $1}')
          account_sha256=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | awk '{print $1}')
          action=$(cat /tmp/d1-provision-action.txt)

          jq -n             --arg control_id "D1_RECOVERY_STAGE_A"             --arg status "PASS"             --arg database_name "$TARGET_DATABASE_NAME"             --arg database_id "$database_id"             --arg account_id_sha256 "$account_sha256"             --arg bookmark_sha256 "$bookmark_sha256"             --arg provision_action "$action"             --arg source_sha "$GITHUB_SHA"             --arg workflow_run_id "$GITHUB_RUN_ID"             --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '{
              schema_version:"1.0",
              control_id:$control_id,
              status:$status,
              target_class:"DEDICATED_RECOVERY_DRILL_ONLY",
              database_name:$database_name,
              database_id:$database_id,
              account_id_sha256:$account_id_sha256,
              bookmark_sha256:$bookmark_sha256,
              provision_action:$provision_action,
              source_sha:$source_sha,
              workflow_run_id:$workflow_run_id,
              observed_at:$observed_at,
              production_database_touched:false,
              restore_executed:false
            }' > evidence/stage-a-summary.json

          test "$(jq -r '.status' evidence/stage-a-summary.json)" = "PASS"
          test "$(jq -r '.production_database_touched' evidence/stage-a-summary.json)" = "false"
          test "$(jq -r '.restore_executed' evidence/stage-a-summary.json)" = "false"

          echo "D1_TIME_TRAVEL_CAPABILITY=PASS"
          echo "D1_RESTORE_DRILL=NOT_EXECUTED_READ_ONLY"
          echo "D1_STAGE_A=PASS database_id=$database_id"

      - name: Build deterministic Stage A evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          sha256sum evidence/database-list.json evidence/database-get.json evidence/time-travel-bookmark.json evidence/stage-a-summary.json > evidence/SHA256SUMS
          if [ -f evidence/database-create.json ]; then
            sha256sum evidence/database-create.json >> evidence/SHA256SUMS
          fi
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -cf evidence/d1-stage-a-evidence.tar -C evidence .
          test -s evidence/d1-stage-a-evidence.tar
          echo "D1_STAGE_A_EVIDENCE_BUNDLE=PASS"

      - name: Attest Stage A evidence
        id: stage_a_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: evidence/d1-stage-a-evidence.tar

      - name: Verify Stage A evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ steps.stage_a_attest.outputs.bundle-path }}'
          test -s "$bundle"

          gh attestation verify evidence/d1-stage-a-evidence.tar             -R "$GITHUB_REPOSITORY"             --bundle "$bundle"             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/provision-d1-recovery-drill.yml"             --source-digest "$GITHUB_SHA"             --source-ref "$GITHUB_REF"             --format json > evidence/attestation-verification.json

          jq -e 'length > 0' evidence/attestation-verification.json >/dev/null
          echo "D1_STAGE_A_ATTESTATION_VERIFY=PASS"

      - name: Retain Stage A evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-recovery-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
