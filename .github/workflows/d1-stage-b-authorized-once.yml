name: Authorized once D1 Stage B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-stage-b-authorized-once.yml"

permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: d1-stage-b-authorized-once
  cancel-in-progress: false

jobs:
  stage-b:
    environment:
      name: d1-recovery-drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_D1_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_RECOVERY_DRILL_ENV_READY: ${{ vars.D1_RECOVERY_DRILL_ENV_READY }}
      DRILL_DATABASE_NAME: ${{ vars.D1_RECOVERY_DRILL_DATABASE_NAME }}
      DRILL_DATABASE_ID: ${{ vars.D1_RECOVERY_DRILL_DATABASE_ID }}
      PERSISTENT_ALLOW_D1_RECOVERY_DRILL: ${{ vars.ALLOW_D1_RECOVERY_DRILL }}
      EXPECTED_DATABASE_NAME: jadel-commercial-runtime-recovery-drill
      EXPECTED_DATABASE_ID: a23852a8-7cf0-409a-a9cc-6eb317c55a11
      ONE_SHOT_AUTHORIZATION: authorized-by-user-stage-b-2026-09-19

    steps:
      - name: Enforce exact isolated target and persistent fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          test "$D1_RECOVERY_DRILL_ENV_READY" = "true"
          test "$DRILL_DATABASE_NAME" = "$EXPECTED_DATABASE_NAME"
          test "$DRILL_DATABASE_ID" = "$EXPECTED_DATABASE_ID"
          test "$PERSISTENT_ALLOW_D1_RECOVERY_DRILL" = "false"
          test "$ONE_SHOT_AUTHORIZATION" = "authorized-by-user-stage-b-2026-09-19"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_API_TOKEN_RAW"
          case "$DRILL_DATABASE_NAME" in
            *-recovery-drill) ;;
            *) echo "Refusing Stage B: non-isolated target." >&2; exit 1 ;;
          esac
          test "$DRILL_DATABASE_NAME" != "jadel-commercial-runtime"
          echo "STAGE_B_EXACT_TARGET=PASS"
          echo "PERSISTENT_ALLOW_BEFORE=false"

      - name: Normalize dedicated D1 token
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_D1_API_TOKEN_RAW:-}"
          token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$token" == \"*\" && "$token" == *\" ]]; then
            token="${token:1:${#token}-2}"
          elif [[ "$token" == \'*\' && "$token" == *\' ]]; then
            token="${token:1:${#token}-2}"
          fi
          test -n "$token"
          echo "::add-mask::$token"
          echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Verify isolated D1 identity before destructive authorization
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DRILL_DATABASE_ID" || true)
          test "$code" = "200"
          test "$(jq -r '.success // false' "$tmp")" = "true"
          test "$(jq -r '.result.uuid // empty' "$tmp")" = "$EXPECTED_DATABASE_ID"
          test "$(jq -r '.result.name // empty' "$tmp")" = "$EXPECTED_DATABASE_NAME"
          test "$(jq -r '.result.version // empty' "$tmp")" = "production"
          echo "D1_STAGE_B_IDENTITY=PASS"

      - name: Enable ephemeral Stage B authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$PERSISTENT_ALLOW_D1_RECOVERY_DRILL" = "false"
          printf 'ALLOW_D1_RECOVERY_DRILL=true\n' >> "$GITHUB_ENV"
          echo "EPHEMERAL_ALLOW_D1_RECOVERY_DRILL=true"
          echo "PERSISTENT_ALLOW_D1_RECOVERY_DRILL=false"

      - name: Execute isolated restore RPO RTO drill
        id: drill
        shell: bash
        run: |
          set -euo pipefail
          test "$ALLOW_D1_RECOVERY_DRILL" = "true"
          mkdir -p evidence

          baseline="baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mutated="mutated-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bookmark=""
          mutation_applied="false"
          restore_verified="false"

          api_base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DRILL_DATABASE_ID"

          query_json() {
            local body="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$body" \
              "$api_base/query" || true)
            test "$code" = "200"
            test "$(jq -r '.success // false' "$out")" = "true"
          }

          read_marker() {
            local out="$1"
            local body
            body=$(jq -n --arg sql "SELECT marker_value FROM __recovery_drill_marker WHERE id=1" '{sql:$sql}')
            query_json "$body" "$out"
            jq -r '.result[0].results[0].marker_value // .result.results[0].marker_value // empty' "$out"
          }

          emergency_restore() {
            set +e
            if [ "$mutation_applied" = "true" ] && [ "$restore_verified" != "true" ] && [ -n "$bookmark" ]; then
              echo "D1_EMERGENCY_RESTORE_ATTEMPTED=YES"
              encoded=$(jq -nr --arg v "$bookmark" '$v|@uri')
              curl -sS -X POST \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "$api_base/time_travel/restore?bookmark=$encoded" \
                > evidence/emergency-restore.json
            fi
          }

          on_exit() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              emergency_restore
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          create_body=$(jq -n --arg sql "CREATE TABLE IF NOT EXISTS __recovery_drill_marker (id INTEGER PRIMARY KEY, marker_value TEXT NOT NULL, updated_at TEXT NOT NULL)" '{sql:$sql}')
          query_json "$create_body" evidence/create-table.json

          delete_body=$(jq -n --arg sql "DELETE FROM __recovery_drill_marker WHERE id=1" '{sql:$sql}')
          query_json "$delete_body" evidence/delete-marker.json

          insert_body=$(jq -n --arg sql "INSERT INTO __recovery_drill_marker(id, marker_value, updated_at) VALUES (1, ?, datetime('now'))" --arg v "$baseline" '{sql:$sql,params:[$v]}')
          query_json "$insert_body" evidence/seed.json

          observed=$(read_marker evidence/baseline-read.json)
          test "$observed" = "$baseline"
          echo "D1_BASELINE_SEED=PASS"

          bookmark_capture_epoch=$(date +%s)
          bookmark_code=$(curl -sS -o evidence/bookmark.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api_base/time_travel/bookmark" || true)
          test "$bookmark_code" = "200"
          test "$(jq -r '.success // false' evidence/bookmark.json)" = "true"
          bookmark=$(jq -r '.result.bookmark // empty' evidence/bookmark.json)
          test -n "$bookmark"
          echo "D1_RECOVERY_BOOKMARK_CAPTURED=PASS"

          mutate_body=$(jq -n --arg sql "UPDATE __recovery_drill_marker SET marker_value=?, updated_at=datetime('now') WHERE id=1" --arg v "$mutated" '{sql:$sql,params:[$v]}')
          query_json "$mutate_body" evidence/mutation.json
          mutation_applied="true"

          observed=$(read_marker evidence/mutated-read.json)
          test "$observed" = "$mutated"
          echo "D1_CONTROLLED_MUTATION=PASS"

          restore_start_epoch=$(date +%s)
          restore_start_ns=$(date +%s%N)
          encoded=$(jq -nr --arg v "$bookmark" '$v|@uri')
          restore_code=$(curl -sS -o evidence/restore.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api_base/time_travel/restore?bookmark=$encoded" || true)
          test "$restore_code" = "200"
          test "$(jq -r '.success // false' evidence/restore.json)" = "true"

          previous_bookmark=$(jq -r '.result.previous_bookmark // empty' evidence/restore.json)
          restored_bookmark=$(jq -r '.result.bookmark // empty' evidence/restore.json)
          test -n "$previous_bookmark"
          test -n "$restored_bookmark"

          restored="false"
          for attempt in $(seq 1 60); do
            if observed=$(read_marker evidence/post-restore-read.json 2>/dev/null); then
              if [ "$observed" = "$baseline" ]; then
                restored="true"
                break
              fi
            fi
            sleep 1
          done
          test "$restored" = "true"

          restore_end_ns=$(date +%s%N)
          rto_ms=$(( (restore_end_ns - restore_start_ns) / 1000000 ))
          recovery_point_age_seconds=$(( restore_start_epoch - bookmark_capture_epoch ))
          restore_verified="true"

          baseline_sha256=$(printf '%s' "$baseline" | sha256sum | awk '{print $1}')
          mutated_sha256=$(printf '%s' "$mutated" | sha256sum | awk '{print $1}')
          previous_bookmark_sha256=$(printf '%s' "$previous_bookmark" | sha256sum | awk '{print $1}')
          restored_bookmark_sha256=$(printf '%s' "$restored_bookmark" | sha256sum | awk '{print $1}')

          jq -n \
            --arg control_id "RESTORE_ROLLBACK_DRILL" \
            --arg status "PASS" \
            --arg database_name "$DRILL_DATABASE_NAME" \
            --arg database_id "$DRILL_DATABASE_ID" \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg baseline_sha256 "$baseline_sha256" \
            --arg mutated_sha256 "$mutated_sha256" \
            --arg previous_bookmark_sha256 "$previous_bookmark_sha256" \
            --arg restored_bookmark_sha256 "$restored_bookmark_sha256" \
            --argjson measured_rto_ms "$rto_ms" \
            --argjson recovery_point_age_seconds "$recovery_point_age_seconds" \
            '{
              schema_version:"1.0",
              control_id:$control_id,
              status:$status,
              target_class:"DEDICATED_RECOVERY_DRILL_ONLY",
              database_name:$database_name,
              database_id:$database_id,
              source_sha:$source_sha,
              workflow_run_id:$run_id,
              workflow_run_attempt:$run_attempt,
              baseline_sha256:$baseline_sha256,
              mutated_sha256:$mutated_sha256,
              previous_bookmark_sha256:$previous_bookmark_sha256,
              restored_bookmark_sha256:$restored_bookmark_sha256,
              measured_rto_ms:$measured_rto_ms,
              recovery_point_age_seconds:$recovery_point_age_seconds,
              persistent_allow_before:false,
              ephemeral_authorization:true,
              production_database_touched:false,
              restore_executed:true,
              data_correctness_verified:true
            }' > evidence/recovery-summary.json

          echo "D1_RESTORE_DATA_CORRECTNESS=PASS"
          echo "D1_UNDO_BOOKMARK_CAPTURED=PASS"
          echo "D1_RTO_MEASURED_MS=$rto_ms"
          echo "D1_RECOVERY_POINT_AGE_SECONDS=$recovery_point_age_seconds"
          echo "RESTORE_ROLLBACK_DRILL=PASS"

      - name: Build Stage B evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.status' evidence/recovery-summary.json)" = "PASS"
          test "$(jq -r '.production_database_touched' evidence/recovery-summary.json)" = "false"
          test "$(jq -r '.restore_executed' evidence/recovery-summary.json)" = "true"
          sha256sum evidence/*.json > evidence/SHA256SUMS
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf evidence/d1-stage-b-evidence.tar -C evidence .
          test -s evidence/d1-stage-b-evidence.tar
          echo "D1_STAGE_B_EVIDENCE_BUNDLE=PASS"

      - name: Attest Stage B evidence
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: evidence/d1-stage-b-evidence.tar

      - name: Verify Stage B evidence attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ steps.attest.outputs.bundle-path }}'
          test -s "$bundle"
          gh attestation verify evidence/d1-stage-b-evidence.tar \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$bundle" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/d1-stage-b-authorized-once.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json > evidence/attestation-verification.json
          jq -e 'length > 0' evidence/attestation-verification.json >/dev/null
          echo "D1_STAGE_B_ATTESTATION_VERIFY=PASS"

      - name: Retain certified Stage B evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-stage-b-certified-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error

      - name: Reset ephemeral authorization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf 'ALLOW_D1_RECOVERY_DRILL=false\n' >> "$GITHUB_ENV"
          test "$PERSISTENT_ALLOW_D1_RECOVERY_DRILL" = "false"
          echo "EPHEMERAL_ALLOW_RESET=false"
          echo "PERSISTENT_ALLOW_AFTER=false"
