name: Apply security hardening migration

on:
  push:
    branches: [security/hardening-2026]
    paths:
      - 'tools/apply_security_hardening.py'
      - '.github/workflows/apply-security-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply source-level CSP hardening
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_security_hardening.py
          grep -Fq 'Content-Security-Policy' index.html
          grep -Fq "default-src 'none'" index.html
          grep -Fq 'strict-origin-when-cross-origin' index.html
          node --check app.js
          echo 'SECURITY_SOURCE_VALIDATION=PASS'
      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'No source hardening change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'security: enforce restrictive source CSP'
          git push origin HEAD:security/hardening-2026
