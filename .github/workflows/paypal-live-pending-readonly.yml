name: Verify PayPal LIVE pending orders read-only

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main SHA approved for this read-only D1 + PayPal LIVE verification
        required: true
        type: string
      confirmation:
        description: Type VERIFY_PAYPAL_LIVE_PENDING_READONLY
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/paypal-live-pending-readonly.yml'

permissions:
  contents: read

concurrency:
  group: jadel-paypal-live-pending-readonly-${{ github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 8aafb343e4ff1fa70ee38e4a3c12fad46c3fc403
  D1_NAME: jadel-commercial-runtime
  PAYPAL_LIVE_API: https://api-m.paypal.com

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate read-only workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/paypal-live-pending-readonly.yml")
          text = path.read_text(encoding="utf-8")

          header, jobs = text.split("\n\njobs:", 1)
          live_payload = jobs.split("\n  d1-candidates:", 1)[1]

          required_header = [
              "VERIFY_PAYPAL_LIVE_PENDING_READONLY",
              "BASELINE_SHA: 8aafb343e4ff1fa70ee38e4a3c12fad46c3fc403",
          ]
          required_live_payload = [
              "po.status='PENDING'",
              "q.status='ACCEPTED'",
              "p.state='PAYMENT_PENDING'",
              "p.policy_status='ALLOWED'",
              "po.provider='paypal'",
              "/v2/checkout/orders/$provider_order_id",
              "PAYPAL_PENDING_READONLY_COMPLETE=PASS",
          ]
          for fragment in required_header:
              if fragment not in header:
                  raise SystemExit(f"READONLY_REQUIRED_HEADER_FRAGMENT_MISSING={fragment}")
          for fragment in required_live_payload:
              if fragment not in live_payload:
                  raise SystemExit(f"READONLY_REQUIRED_LIVE_FRAGMENT_MISSING={fragment}")

          forbidden = [
              "/capture",
              "/refund",
              "/authorize",
              "/void",
              "/v1/payments/payouts",
              "wrangler deploy",
              "wrangler secret",
              "INSERT INTO",
              "UPDATE payment_",
              "UPDATE quotes",
              "UPDATE project_requests",
              "DELETE FROM",
              "REPLACE INTO",
              "DROP TABLE",
              "ALTER TABLE",
          ]
          for fragment in forbidden:
              if fragment in live_payload:
                  raise SystemExit(f"READONLY_FORBIDDEN_FRAGMENT={fragment}")

          if re.search(r"\$PAYPAL_LIVE_API/v2/checkout/orders/[^\n]*\n[^\n]*-X\s+POST", live_payload):
              raise SystemExit("PAYPAL_ORDER_POST_PRESENT=FAIL")

          print("PAYPAL_PENDING_READONLY_CONTRACT=PASS")
          PY

  d1-candidates:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'VERIFY_PAYPAL_LIVE_PENDING_READONLY' }}
    needs: contract
    environment:
      name: d1-recovery-drill
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    outputs:
      candidate_count: ${{ steps.query.outputs.candidate_count }}
      candidates_b64: ${{ steps.query.outputs.candidates_b64 }}
    env:
      CLOUDFLARE_D1_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout immutable approved revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main and baseline delta
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          changed=$(git diff --name-only "$BASELINE_SHA" "$EXPECTED_SHA")
          test "$changed" = ".github/workflows/paypal-live-pending-readonly.yml" || {
            echo "READONLY_BASELINE_DELTA_UNEXPECTED=YES" >&2
            printf '%s\n' "$changed" >&2
            exit 10
          }
          test -z "$(git status --porcelain)"
          echo PAYPAL_PENDING_READONLY_SHA_GATE=PASS

      - name: Query authoritative D1 candidates with SELECT only
        id: query
        shell: bash
        run: |
          set -euo pipefail
          token=$(printf '%s' "${CLOUDFLARE_D1_API_TOKEN_RAW:-}" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          account=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID_RAW:-}" | tr -d '\r\n[:space:]')
          test -n "$token"; test -n "$account"; echo "::add-mask::$token"
          auth=(-H "Authorization: Bearer $token" -H 'Content-Type: application/json')

          dbs=$(curl --fail-with-body -sS "${auth[@]}"             "https://api.cloudflare.com/client/v4/accounts/$account/d1/database?name=${D1_NAME}&per_page=100")
          test "$(jq -r '.success' <<<"$dbs")" = true
          test "$(jq -r --arg n "$D1_NAME" '[.result[]|select(.name==$n)]|length' <<<"$dbs")" = 1
          db=$(jq -r --arg n "$D1_NAME" '.result[]|select(.name==$n)|.uuid' <<<"$dbs")
          test -n "$db" && test "$db" != null

          sql="SELECT po.payment_order_id,po.provider_order_id,po.status AS payment_status,po.amount_minor,po.currency_code,po.project_id,po.quote_id,q.status AS quote_status,p.state AS project_state,p.policy_status FROM payment_orders po JOIN quotes q ON q.quote_id=po.quote_id JOIN project_requests p ON p.project_id=po.project_id WHERE po.status='PENDING' AND q.status='ACCEPTED' AND p.state='PAYMENT_PENDING' AND p.policy_status='ALLOWED' AND po.provider='paypal' AND po.provider_order_id IS NOT NULL AND po.provider_order_id<>'' ORDER BY po.created_at ASC LIMIT 26;"
          printf '%s' "$sql" | grep -Eq '^SELECT '
          ! printf '%s' "$sql" | grep -Eiq '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|TRUNCATE|CREATE|UPSERT)\b'

          # Cloudflare D1's remote query API uses POST as transport even for SELECT.
          # The SQL contract above is SELECT-only and cannot mutate the database.
          response=$(curl --fail-with-body -sS -X POST "${auth[@]}"             "https://api.cloudflare.com/client/v4/accounts/$account/d1/database/$db/query"             --data "$(jq -n --arg sql "$sql" '{sql:$sql}')")
          test "$(jq -r '.success' <<<"$response")" = true

          candidates=$(jq -c '.result[0].results // []' <<<"$response")
          count=$(jq 'length' <<<"$candidates")
          [ "$count" -le 25 ] || { echo PAYPAL_PENDING_CANDIDATE_LIMIT_EXCEEDED=YES >&2; exit 11; }

          jq -e 'all(.[];
            .payment_status=="PENDING" and
            .quote_status=="ACCEPTED" and
            .project_state=="PAYMENT_PENDING" and
            .policy_status=="ALLOWED" and
            .currency_code=="USD" and
            (.amount_minor|tonumber)>0 and
            (.payment_order_id|type)=="string" and
            (.provider_order_id|type)=="string" and
            (.quote_id|type)=="string"
          )' <<<"$candidates" >/dev/null

          candidates_b64=$(printf '%s' "$candidates" | base64 -w0)
          echo "candidate_count=$count" >> "$GITHUB_OUTPUT"
          echo "candidates_b64=$candidates_b64" >> "$GITHUB_OUTPUT"
          echo "PAYPAL_PENDING_D1_CANDIDATES=$count"

  paypal-verify:
    if: ${{ needs.d1-candidates.outputs.candidate_count != '0' }}
    needs: d1-candidates
    environment:
      name: jadeltechrd
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PAYPAL_CLIENT_ID_RAW: ${{ secrets.PAYPAL_CLIENT_ID }}
      PAYPAL_CLIENT_SECRET_RAW: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      CANDIDATES_B64: ${{ needs.d1-candidates.outputs.candidates_b64 }}
    steps:
      - name: Checkout immutable approved revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck exact main and baseline delta
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          changed=$(git diff --name-only "$BASELINE_SHA" "$EXPECTED_SHA")
          test "$changed" = ".github/workflows/paypal-live-pending-readonly.yml"
          test -z "$(git status --porcelain)"

      - name: Read PayPal LIVE order states
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          printf '%s' "$CANDIDATES_B64" | base64 -d > /tmp/candidates.json
          jq -e 'type=="array"' /tmp/candidates.json >/dev/null

          client_id=$(printf '%s' "${PAYPAL_CLIENT_ID_RAW:-}" | tr -d '\r\n')
          client_secret=$(printf '%s' "${PAYPAL_CLIENT_SECRET_RAW:-}" | tr -d '\r\n')
          test -n "$client_id"; test -n "$client_secret"
          echo "::add-mask::$client_id"; echo "::add-mask::$client_secret"

          # PayPal OAuth token issuance is a non-financial authentication POST.
          # No state-changing PayPal Orders or money-movement operation is permitted in this workflow.
          token=$(curl --fail-with-body -sS -u "$client_id:$client_secret"             -H 'Accept: application/json'             -d 'grant_type=client_credentials'             "$PAYPAL_LIVE_API/v1/oauth2/token" | jq -r '.access_token // empty')
          test -n "$token"; echo "::add-mask::$token"

          : > evidence/paypal-live-pending-readonly.ndjson
          while IFS= read -r candidate; do
            payment_order_id=$(jq -r '.payment_order_id' <<<"$candidate")
            provider_order_id=$(jq -r '.provider_order_id' <<<"$candidate")
            quote_id=$(jq -r '.quote_id' <<<"$candidate")
            amount_minor=$(jq -r '.amount_minor|tonumber' <<<"$candidate")
            currency=$(jq -r '.currency_code' <<<"$candidate")

            [[ "$payment_order_id" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$quote_id" =~ ^[0-9a-fA-F-]{36}$ ]]
            [[ "$provider_order_id" =~ ^[A-Za-z0-9-]{1,128}$ ]]
            test "$currency" = USD

            order=$(curl --fail-with-body -sS               -H "Authorization: Bearer $token"               "$PAYPAL_LIVE_API/v2/checkout/orders/$provider_order_id")

            status=$(jq -r '.status // empty' <<<"$order")
            custom_id=$(jq -r '.purchase_units[0].custom_id // empty' <<<"$order")
            invoice_id=$(jq -r '.purchase_units[0].invoice_id // empty' <<<"$order")
            provider_currency=$(jq -r '.purchase_units[0].amount.currency_code // empty' <<<"$order")
            provider_amount=$(jq -r '.purchase_units[0].amount.value // empty' <<<"$order")
            expected_amount=$(printf '%d.%02d' "$((amount_minor / 100))" "$((amount_minor % 100))")

            binding_ok=false
            if [ "$custom_id" = "$payment_order_id" ] &&
               [ "$invoice_id" = "$quote_id" ] &&
               [ "$provider_currency" = USD ] &&
               [ "$provider_amount" = "$expected_amount" ]; then
              binding_ok=true
            fi

            approved=false
            [ "$status" = APPROVED ] && [ "$binding_ok" = true ] && approved=true

            jq -n               --arg payment_order_id "$payment_order_id"               --arg paypal_order_id "$provider_order_id"               --arg quote_id "$quote_id"               --arg project_id "$(jq -r '.project_id' <<<"$candidate")"               --arg status "$status"               --arg currency "$provider_currency"               --arg amount "$provider_amount"               --argjson binding_ok "$binding_ok"               --argjson approved "$approved"               '{
                payment_order_id:$payment_order_id,
                paypal_order_id:$paypal_order_id,
                quote_id:$quote_id,
                project_id:$project_id,
                d1_states:{payment:"PENDING",quote:"ACCEPTED",project:"PAYMENT_PENDING",policy:"ALLOWED"},
                paypal_status:$status,
                currency_code:$currency,
                amount:$amount,
                binding_ok:$binding_ok,
                approved_for_capture_gate:$approved
              }' >> evidence/paypal-live-pending-readonly.ndjson
          done < <(jq -c '.[]' /tmp/candidates.json)

          jq -s '.' evidence/paypal-live-pending-readonly.ndjson > evidence/paypal-live-pending-readonly.json
          approved_count=$(jq '[.[]|select(.approved_for_capture_gate==true)]|length' evidence/paypal-live-pending-readonly.json)
          mismatch_count=$(jq '[.[]|select(.binding_ok!=true)]|length' evidence/paypal-live-pending-readonly.json)
          candidate_count=$(jq 'length' evidence/paypal-live-pending-readonly.json)

          {
            echo '## PayPal LIVE pending-order read-only verification'
            echo
            echo "- D1 candidates: $candidate_count"
            echo "- PayPal APPROVED with exact binding: $approved_count"
            echo "- Binding mismatches: $mismatch_count"
            echo '- Financial mutation: NONE'
            echo '- Financial side effects: NOT PERFORMED'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "approved_count=$approved_count" >> "$GITHUB_OUTPUT"
          echo "mismatch_count=$mismatch_count" >> "$GITHUB_OUTPUT"
          echo "PAYPAL_PENDING_READONLY_COMPLETE=PASS"

      - name: Upload read-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paypal-live-pending-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/paypal-live-pending-readonly.*
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed on provider binding mismatch
        if: ${{ steps.verify.outputs.mismatch_count != '0' }}
        shell: bash
        run: |
          echo PAYPAL_PENDING_BINDING_MISMATCH=FAIL >&2
          exit 20

  no-candidates:
    if: ${{ needs.d1-candidates.outputs.candidate_count == '0' }}
    needs: d1-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Summarize empty candidate set
        shell: bash
        run: |
          {
            echo '## PayPal LIVE pending-order read-only verification'
            echo
            echo '- D1 candidates matching PENDING/ACCEPTED/PAYMENT_PENDING/ALLOWED: 0'
            echo '- PayPal order lookup: not needed'
            echo '- Financial mutation: NONE'
            echo '- Financial side effects: NOT PERFORMED'
          } >> "$GITHUB_STEP_SUMMARY"
          echo PAYPAL_PENDING_READONLY_COMPLETE=PASS
