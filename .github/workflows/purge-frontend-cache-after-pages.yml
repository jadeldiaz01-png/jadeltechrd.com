name: Purge frontend cache after Pages

on:
  workflow_run:
    workflows: ["Deploy public site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: jadeltechrd
    env:
      DOMAIN: jadeltechrd.com
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
      CLOUDFLARE_ZONE_ID_RAW: ${{ secrets.CLOUDFLARE_ZONE_ID || secrets.CF_ZONE_ID }}
    steps:
      - name: Normalize Cloudflare authority and resolve zone
        id: zone
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_API_TOKEN_RAW:-}"
          token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$token" == \"*\" && "$token" == *\" ]]; then token="${token:1:${#token}-2}"; fi
          test -n "$token" || { echo 'CLOUDFLARE_TOKEN_PRESENT=NO'; exit 2; }
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

          zone_id=$(printf '%s' "${CLOUDFLARE_ZONE_ID_RAW:-}" | tr -d '\r\n[:space:]')
          if [ -n "$zone_id" ]; then
            echo 'CLOUDFLARE_ZONE_ID_SOURCE=SECRET'
          else
            echo 'CLOUDFLARE_ZONE_ID_SOURCE=DISCOVERY'
            tmp=$(mktemp)
            code=$(curl -sS -o "$tmp" -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}&status=active&per_page=50" || true)
            echo "CLOUDFLARE_ZONE_DISCOVERY_HTTP=${code}"
            if [ "$code" != 200 ]; then
              jq -c '{success,errors}' "$tmp" 2>/dev/null || true
              echo 'CLOUDFLARE_ZONE_DISCOVERY=FAIL'
              exit 6
            fi
            zone_id=$(jq -r --arg d "$DOMAIN" '.result[]? | select(.name==$d) | .id' "$tmp" | head -n1)
          fi

          if ! [[ "$zone_id" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo 'CLOUDFLARE_ZONE_ID_VALID=NO'
            exit 7
          fi
          echo "::add-mask::$zone_id"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo 'CLOUDFLARE_ZONE_ACCESS=PASS'

      - name: Purge mutable frontend assets
        shell: bash
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg domain "$DOMAIN" '{files:[
            ("https://" + $domain + "/"),
            ("https://" + $domain + "/app.js"),
            ("https://" + $domain + "/project-intake-bridge.js"),
            ("https://" + $domain + "/styles.css")
          ]}')
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" || true)
          if [ "$code" != 200 ] || [ "$(jq -r '.success // false' "$tmp")" != true ]; then
            echo "CLOUDFLARE_CACHE_PURGE=FAIL_HTTP_${code}"
            jq -c '{success,errors}' "$tmp" || true
            exit 3
          fi
          echo 'CLOUDFLARE_CACHE_PURGE=PASS'

      - name: Verify deployed single-owner fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "https://${DOMAIN}/app.js?verify=${GITHUB_RUN_ID}-${attempt}" \
              --output /tmp/app.js
            home=$(curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "https://${DOMAIN}/")
            if grep -Fq 'const INTAKE_PATH = "/solicitar-proyecto.html"' /tmp/app.js \
              && grep -Fq 'const governedIntakeUrl = (ids)' /tmp/app.js \
              && ! grep -Fq 'const directCheckout =' /tmp/app.js \
              && ! grep -Fq '/project-intake-bridge.js' <<<"$home"; then
              echo "DEPLOYED_SINGLE_OWNER_FINGERPRINT=PASS attempt=${attempt}"
              exit 0
            fi
            echo "DEPLOYED_SINGLE_OWNER_FINGERPRINT=STALE attempt=${attempt}"
            sleep 5
          done
          echo 'DEPLOYED_SINGLE_OWNER_FINGERPRINT=FAIL'
          exit 4
