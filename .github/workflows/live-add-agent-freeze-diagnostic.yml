name: Live add-agent freeze diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/live-add-agent-freeze-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Install pinned Puppeteer and Chrome
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-add-agent-freeze"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          test "$(node -p "require('puppeteer/package.json').version")" = "$PUPPETEER_VERSION"

      - name: Exercise every live Add button on desktop and Android-sized viewport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live-add-agent-freeze"
          SITE="$SITE" node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');

          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1100, deviceScaleFactor: 1, isMobile: false, hasTouch: false } },
            { name: 'android', viewport: { width: 412, height: 915, deviceScaleFactor: 2.625, isMobile: true, hasTouch: true } },
          ];

          async function withTimeout(promise, ms, label) {
            let timer;
            try {
              return await Promise.race([
                promise,
                new Promise((_, reject) => {
                  timer = setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms);
                }),
              ]);
            } finally {
              clearTimeout(timer);
            }
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 30000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });

            try {
              console.log(`BROWSER_VERSION=${await browser.version()}`);
              for (const profile of profiles) {
                const page = await browser.newPage();
                page.setDefaultTimeout(8000);
                await page.setViewport(profile.viewport);

                const pageErrors = [];
                const consoleErrors = [];
                page.on('pageerror', (error) => pageErrors.push(String(error)));
                page.on('console', (msg) => {
                  if (msg.type() === 'error') consoleErrors.push(msg.text());
                });

                await withTimeout(
                  page.goto(process.env.SITE, { waitUntil: 'networkidle2', timeout: 20000 }),
                  25000,
                  `${profile.name}: navigation`,
                );

                await page.waitForSelector('[data-add-service]', { visible: true });
                const ids = await page.$$eval('[data-add-service]', nodes => nodes.map(n => n.getAttribute('data-add-service')));
                assert.ok(ids.length >= 11, `${profile.name}: expected at least 11 service add buttons, got ${ids.length}`);
                console.log(`${profile.name}:SERVICE_IDS=${ids.join(',')}`);

                for (const id of ids) {
                  const selector = `[data-add-service="${id}"]`;
                  await page.evaluate(sel => document.querySelector(sel)?.scrollIntoView({ block: 'center' }), selector);
                  await new Promise(r => setTimeout(r, 75));

                  const before = await page.$$eval('[data-remove-service]', nodes => nodes.length);
                  const started = Date.now();
                  await withTimeout(page.click(selector), 5000, `${profile.name}:${id}: click`);
                  await withTimeout(
                    page.waitForFunction((expected) => document.querySelectorAll('[data-remove-service]').length === expected, {}, before + 1),
                    5000,
                    `${profile.name}:${id}: selection render`,
                  );
                  const elapsed = Date.now() - started;
                  console.log(`${profile.name}:${id}:ADD_MS=${elapsed}`);
                  assert.ok(elapsed < 5000, `${profile.name}:${id}: add interaction exceeded 5s`);

                  const buttonState = await page.$eval(selector, node => ({
                    text: node.textContent.trim(),
                    pressed: node.getAttribute('aria-pressed'),
                  }));
                  assert.equal(buttonState.pressed, 'true', `${profile.name}:${id}: aria-pressed not true after add`);

                  const cta = await page.$eval('#request-payment', node => ({
                    text: node.textContent.trim(),
                    href: node.getAttribute('href'),
                    governed: node.getAttribute('data-governed-intake'),
                  }));
                  assert.equal(cta.governed, 'true', `${profile.name}:${id}: governed intake marker missing`);
                  assert.ok(!String(cta.href).startsWith('mailto:'), `${profile.name}:${id}: legacy mailto escaped bridge`);
                }

                const selected = await page.$$eval('[data-remove-service]', nodes => nodes.length);
                assert.equal(selected, ids.length, `${profile.name}: not all services remained selected`);

                for (const id of [...ids].reverse()) {
                  const selector = `[data-remove-service="${id}"]`;
                  await page.evaluate(sel => document.querySelector(sel)?.scrollIntoView({ block: 'center' }), selector);
                  const before = await page.$$eval('[data-remove-service]', nodes => nodes.length);
                  await withTimeout(page.click(selector), 5000, `${profile.name}:${id}: remove click`);
                  await withTimeout(
                    page.waitForFunction((expected) => document.querySelectorAll('[data-remove-service]').length === expected, {}, before - 1),
                    5000,
                    `${profile.name}:${id}: remove render`,
                  );
                }

                assert.deepEqual(pageErrors, [], `${profile.name}: page errors: ${pageErrors.join(' | ')}`);
                if (consoleErrors.length) console.log(`${profile.name}:CONSOLE_ERRORS=${consoleErrors.join(' | ')}`);
                console.log(`${profile.name}:ADD_REMOVE_ALL=PASS`);
                await page.close();
              }
              console.log('LIVE_ADD_AGENT_FREEZE_DIAGNOSTIC=PASS');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
