name: Live add-agent freeze diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/live-add-agent-freeze-diagnostic.yml'
      - 'project-intake-bridge.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Install pinned browser and snapshot live frontend
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-add-agent-freeze"
          mkdir -p "$work/old" "$work/new"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          test "$(node -p "require('puppeteer/package.json').version")" = "$PUPPETEER_VERSION"

          for file in index.html app.js styles.css project-intake-bridge.js; do
            curl --fail --silent --show-error --location "$SITE/${file#index.html}" --output "$work/old/$file"
          done
          cp "$work/old/index.html" "$work/new/index.html"
          cp "$work/old/app.js" "$work/new/app.js"
          cp "$work/old/styles.css" "$work/new/styles.css"

          ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/jadeldiaz01-png/jadeltechrd.com/${ref}/project-intake-bridge.js" \
            --output "$work/new/project-intake-bridge.js"

          test -s "$work/old/index.html"
          test -s "$work/old/app.js"
          test -s "$work/old/project-intake-bridge.js"
          test -s "$work/new/project-intake-bridge.js"

      - name: A/B current live bridge against patched bridge
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-add-agent-freeze"
          python3 -m http.server 8765 --directory "$work/old" >/tmp/old-server.log 2>&1 &
          old_pid=$!
          python3 -m http.server 8766 --directory "$work/new" >/tmp/new-server.log 2>&1 &
          new_pid=$!
          trap 'kill "$old_pid" "$new_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          curl --fail --silent http://127.0.0.1:8766/ >/dev/null

          cd "$work"
          node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');

          async function tryClick(page, selector, ms = 5000) {
            let timer;
            try {
              return await Promise.race([
                page.click(selector).then(() => ({ ok: true })),
                new Promise(resolve => { timer = setTimeout(() => resolve({ ok: false, timeout: true }), ms); }),
              ]);
            } finally {
              clearTimeout(timer);
            }
          }

          async function open(browser, port) {
            const page = await browser.newPage();
            page.setDefaultTimeout(8000);
            await page.setViewport({ width: 412, height: 915, deviceScaleFactor: 2.625, isMobile: true, hasTouch: true });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            await page.goto(`http://127.0.0.1:${port}/`, { waitUntil: 'domcontentloaded', timeout: 15000 });
            await page.waitForSelector('[data-add-service="architecture"]', { visible: true });
            await new Promise(resolve => setTimeout(resolve, 300));
            return { page, errors };
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 30000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });
            try {
              console.log(`BROWSER_VERSION=${await browser.version()}`);

              const old = await open(browser, 8765);
              const oldStart = Date.now();
              const oldClick = await tryClick(old.page, '[data-add-service="architecture"]');
              console.log(`CURRENT_BRIDGE_CLICK_OK=${oldClick.ok}`);
              console.log(`CURRENT_BRIDGE_CLICK_MS=${Date.now() - oldStart}`);
              assert.equal(oldClick.ok, false, 'current production bridge must reproduce the observed freeze in the A/B snapshot');
              await old.page.close().catch(() => {});

              const fixed = await open(browser, 8766);
              const ids = await fixed.page.$$eval('[data-add-service]', nodes => nodes.map(n => n.getAttribute('data-add-service')));
              assert.deepEqual(ids, ['architecture','support','sales','social','cineforge','meta','analytics','revenue','quant','governance','multiagent']);

              for (let index = 0; index < ids.length; index += 1) {
                const id = ids[index];
                const selector = `[data-add-service="${id}"]`;
                await fixed.page.evaluate(sel => document.querySelector(sel)?.scrollIntoView({ block: 'center' }), selector);
                const before = await fixed.page.$$eval('[data-remove-service]', nodes => nodes.length);
                const started = Date.now();
                const click = await tryClick(fixed.page, selector);
                assert.equal(click.ok, true, `${id}: patched bridge click froze`);
                await fixed.page.waitForFunction(expected => document.querySelectorAll('[data-remove-service]').length === expected, {}, before + 1);

                const expectedServices = ids.slice(0, Math.min(index + 1, 8));
                await fixed.page.waitForFunction((expected) => {
                  const node = document.querySelector('#request-payment');
                  if (node?.dataset.governedIntake !== 'true') return false;
                  const url = new URL(node.getAttribute('href'), window.location.origin);
                  return url.pathname === '/solicitar-proyecto.html' &&
                    url.searchParams.get('services') === expected.join(',');
                }, { timeout: 2000 }, expectedServices);

                const elapsed = Date.now() - started;
                console.log(`PATCHED_${id}_ADD_MS=${elapsed}`);
                const cta = await fixed.page.$eval('#request-payment', node => ({
                  href: node.getAttribute('href'),
                  governed: node.dataset.governedIntake,
                }));
                assert.equal(cta.governed, 'true');
                const ctaUrl = new URL(cta.href, 'http://127.0.0.1:8766');
                assert.equal(ctaUrl.pathname, '/solicitar-proyecto.html', `${id}: CTA escaped governed intake pathname`);
                assert.equal(ctaUrl.searchParams.get('services'), expectedServices.join(','), `${id}: CTA service query mismatch`);
              }

              assert.deepEqual(fixed.errors, [], `patched page errors: ${fixed.errors.join(' | ')}`);
              console.log('PATCHED_BRIDGE_ALL_11_ADD=PASS');
              console.log('GOVERNED_INTAKE_PATH_ALL_11=PASS');
              console.log('FREEZE_ROOT_CAUSE_BRIDGE_AB_TEST=CONFIRMED');
              await fixed.page.close();
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
