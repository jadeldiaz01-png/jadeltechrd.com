name: Live add-agent freeze diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/live-add-agent-freeze-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Install pinned Puppeteer and Chrome
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-add-agent-freeze"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          test "$(node -p "require('puppeteer/package.json').version")" = "$PUPPETEER_VERSION"

      - name: Isolate live freeze to compatibility bridge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live-add-agent-freeze"
          SITE="$SITE" node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');

          async function tryClick(page, selector, ms = 5000) {
            let timer;
            try {
              const result = await Promise.race([
                page.click(selector).then(() => ({ ok: true })),
                new Promise(resolve => { timer = setTimeout(() => resolve({ ok: false, timeout: true }), ms); }),
              ]);
              return result;
            } finally {
              clearTimeout(timer);
            }
          }

          async function openPage(browser, blockBridge) {
            const page = await browser.newPage();
            page.setDefaultTimeout(8000);
            await page.setViewport({ width: 412, height: 915, deviceScaleFactor: 2.625, isMobile: true, hasTouch: true });
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            if (blockBridge) {
              await page.setRequestInterception(true);
              page.on('request', req => {
                if (req.url().endsWith('/project-intake-bridge.js')) {
                  req.respond({ status: 200, contentType: 'application/javascript', body: '/* diagnostic: bridge disabled */' });
                } else req.continue();
              });
            }
            await page.goto(process.env.SITE, { waitUntil: 'networkidle2', timeout: 20000 });
            await page.waitForSelector('[data-add-service="architecture"]', { visible: true });
            return { page, errors };
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 30000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });
            try {
              console.log(`BROWSER_VERSION=${await browser.version()}`);

              const normal = await openPage(browser, false);
              const normalStarted = Date.now();
              const normalClick = await tryClick(normal.page, '[data-add-service="architecture"]');
              console.log(`NORMAL_BRIDGE_CLICK_OK=${normalClick.ok}`);
              console.log(`NORMAL_BRIDGE_CLICK_MS=${Date.now() - normalStarted}`);
              await normal.page.close().catch(() => {});

              const isolated = await openPage(browser, true);
              const before = await isolated.page.$$eval('[data-remove-service]', nodes => nodes.length);
              const isolatedStarted = Date.now();
              const isolatedClick = await tryClick(isolated.page, '[data-add-service="architecture"]');
              console.log(`BRIDGE_DISABLED_CLICK_OK=${isolatedClick.ok}`);
              console.log(`BRIDGE_DISABLED_CLICK_MS=${Date.now() - isolatedStarted}`);
              assert.equal(isolatedClick.ok, true, 'architecture Add must remain responsive with compatibility bridge disabled');
              await isolated.page.waitForFunction(expected => document.querySelectorAll('[data-remove-service]').length === expected, {}, before + 1);
              assert.deepEqual(isolated.errors, []);
              console.log('BRIDGE_DISABLED_ADD_RENDER=PASS');
              await isolated.page.close();

              assert.equal(normalClick.ok, false, 'expected current live compatibility bridge to reproduce the freeze');
              console.log('FREEZE_ROOT_CAUSE_COMPATIBILITY_BRIDGE=CONFIRMED');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
