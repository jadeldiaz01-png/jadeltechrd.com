name: Deploy public site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "solicitar-proyecto.html"
      - "project-request.css"
      - "project-request.js"
      - "agent-readiness.html"
      - "agent-readiness.js"
      - "approval-console.html"
      - "approval-console.js"
      - "robots.txt"
      - "sitemap.xml"
      - ".nojekyll"
      - "config/agent-readiness-data.js"
      - "config/agent-production-manifest.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Stage immutable frontend asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/config

          install -m 0644 index.html _site/index.html
          install -m 0644 styles.css _site/styles.css
          install -m 0644 solicitar-proyecto.html _site/solicitar-proyecto.html
          install -m 0644 project-request.css _site/project-request.css
          install -m 0644 project-request.js _site/project-request.js
          install -m 0644 agent-readiness.html _site/agent-readiness.html
          install -m 0644 agent-readiness.js _site/agent-readiness.js
          install -m 0644 approval-console.html _site/approval-console.html
          install -m 0644 approval-console.js _site/approval-console.js
          install -m 0644 robots.txt _site/robots.txt
          install -m 0644 sitemap.xml _site/sitemap.xml
          install -m 0644 .nojekyll _site/.nojekyll
          install -m 0644 config/agent-readiness-data.js _site/config/agent-readiness-data.js
          install -m 0644 config/agent-production-manifest.json _site/config/agent-production-manifest.json

          immutable_app="app.${GITHUB_SHA}.js"
          install -m 0644 app.js "_site/${immutable_app}"
          IMMUTABLE_APP="$immutable_app" python - <<'PY'
          import os
          from pathlib import Path

          path = Path("_site/index.html")
          html = path.read_text(encoding="utf-8")
          old = '<script src="/app.js" defer></script>'
          new = f'<script src="/{os.environ["IMMUTABLE_APP"]}" defer></script>'
          if html.count(old) != 1:
              raise SystemExit("expected exactly one mutable app.js script reference")
          path.write_text(html.replace(old, new), encoding="utf-8")
          PY

          grep -Fq "<script src=\"/${immutable_app}\" defer></script>" _site/index.html
          test -s "_site/${immutable_app}"

          expected=$(mktemp)
          actual=$(mktemp)
          cat >"$expected" <<EOF
          .nojekyll
          agent-readiness.html
          agent-readiness.js
          approval-console.html
          approval-console.js
          ${immutable_app}
          config/agent-production-manifest.json
          config/agent-readiness-data.js
          index.html
          project-request.css
          project-request.js
          robots.txt
          sitemap.xml
          solicitar-proyecto.html
          styles.css
          EOF
          find _site -type f -printf '%P\n' | sort >"$actual"
          sort -o "$expected" "$expected"
          diff -u "$expected" "$actual"
          test ! -e _site/docs
          test ! -e _site/infra
          test ! -e _site/ops
          test ! -e _site/policy
          test ! -e _site/scripts
          test ! -e _site/security
          test ! -e _site/commercial-runtime
          echo "PUBLIC_ASSET_ALLOWLIST=PASS"
          echo "IMMUTABLE_APP_ASSET=${immutable_app}"

      - name: Build deterministic deployment evidence and CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence
          SOURCE_SHA="$GITHUB_SHA" SOURCE_TIME="$(git show -s --format=%cI "$GITHUB_SHA")" python - <<'PY'
          import hashlib
          import json
          import os
          import uuid
          from pathlib import Path

          root = Path("_site")
          files = []
          components = []
          for path in sorted(p for p in root.rglob("*") if p.is_file() and not p.is_symlink()):
              rel = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              size = path.stat().st_size
              files.append({"path": rel, "sha256": digest, "size": size})
              components.append({
                  "type": "file",
                  "name": rel,
                  "hashes": [{"alg": "SHA-256", "content": digest}],
                  "properties": [{"name": "jadeltechrd:fileSize", "value": str(size)}]
              })

          sha = os.environ["SOURCE_SHA"]
          timestamp = os.environ["SOURCE_TIME"]
          repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
          sbom_serial = uuid.uuid5(uuid.NAMESPACE_URL, f"https://github.com/{repo}@{sha}")
          release_manifest = {
              "schema_version": "1.0",
              "source_repository": os.environ.get("GITHUB_REPOSITORY"),
              "source_sha": sha,
              "generated_from": "_site",
              "file_count": len(files),
              "files": files
          }
          sbom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.7",
              "serialNumber": f"urn:uuid:{sbom_serial}",
              "version": 1,
              "metadata": {
                  "timestamp": timestamp,
                  "component": {
                      "type": "application",
                      "name": "jadeltechrd.com-public-site",
                      "version": sha
                  },
                  "properties": [
                      {"name": "jadeltechrd:sourceRepository", "value": os.environ.get("GITHUB_REPOSITORY", "")},
                      {"name": "jadeltechrd:sourceSha", "value": sha}
                  ]
              },
              "components": components
          }
          Path("evidence/site-release-manifest.json").write_text(json.dumps(release_manifest, indent=2) + "\n", encoding="utf-8")
          Path("evidence/bom.cdx.json").write_text(json.dumps(sbom, indent=2) + "\n", encoding="utf-8")
          PY

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf evidence/site-release.tar -C _site .
          sha256sum evidence/site-release.tar evidence/bom.cdx.json evidence/site-release-manifest.json > evidence/SHA256SUMS
          test -s evidence/site-release.tar
          test -s evidence/bom.cdx.json
          test -s evidence/site-release-manifest.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.7" and (.serialNumber | startswith("urn:uuid:"))' evidence/bom.cdx.json >/dev/null
          python - <<'PY'
          import json
          import uuid
          from pathlib import Path
          bom = json.loads(Path("evidence/bom.cdx.json").read_text(encoding="utf-8"))
          serial = bom["serialNumber"]
          uuid.UUID(serial.removeprefix("urn:uuid:"))
          print("CYCLONEDX_SERIAL_VALID=PASS")
          PY
          echo 'DEPLOYMENT_EVIDENCE_BUNDLE=PASS'
          echo 'CYCLONEDX_1_7_SBOM=PASS'

      - name: Attest deployment bundle provenance
        id: provenance_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: evidence/site-release.tar

      - name: Attest deployment SBOM
        id: sbom_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: evidence/site-release.tar
          sbom-path: evidence/bom.cdx.json

      - name: Verify deployment attestations before promotion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_bundle='${{ steps.provenance_attest.outputs.bundle-path }}'
          sbom_bundle='${{ steps.sbom_attest.outputs.bundle-path }}'
          test -s "$provenance_bundle"
          test -s "$sbom_bundle"
          signer_workflow="$GITHUB_REPOSITORY/.github/workflows/pages.yml"

          gh attestation verify evidence/site-release.tar \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$provenance_bundle" \
            --signer-workflow "$signer_workflow" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json | tee /tmp/provenance-verify.json

          gh attestation verify evidence/site-release.tar \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$sbom_bundle" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$signer_workflow" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json | tee /tmp/sbom-verify.json

          test -s /tmp/provenance-verify.json
          test -s /tmp/sbom-verify.json
          jq -e 'length > 0' /tmp/provenance-verify.json >/dev/null
          jq -e 'length > 0' /tmp/sbom-verify.json >/dev/null
          echo 'DEPLOYMENT_PROVENANCE_VERIFY=PASS'
          echo 'DEPLOYMENT_SBOM_ATTESTATION_VERIFY=PASS'

      - name: Retain promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-site-promotion-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
