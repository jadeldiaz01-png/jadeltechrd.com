name: Diagnose GitHub Pages binding

on:
  push:
    branches:
      - diag/cloudflare-edge-routing
    paths:
      - '.github/workflows/github-pages-binding-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  diagnose-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GitHub Pages site configuration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages" || true)
          echo "GITHUB_PAGES_CONFIG_HTTP=${code}"
          if [ "$code" = 200 ]; then
            jq -c '{status,cname,custom_404,html_url,build_type,source,https_certificate:(.https_certificate // null),https_enforced}' "$tmp"
          else
            jq -c '{message,documentation_url,status}' "$tmp" 2>/dev/null || cat "$tmp"
            exit 1
          fi
