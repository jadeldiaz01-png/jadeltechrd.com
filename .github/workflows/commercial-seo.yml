name: Validate commercial SEO assets

on:
  pull_request:
    paths:
      - '.github/workflows/commercial-seo.yml'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate server-visible metadata and discovery files
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree

          html = Path("index.html").read_text(encoding="utf-8")
          assert "<title>Agentes de IA &amp; Automatización | Jadel Tech RD</title>" in html or "<title>Agentes de IA & Automatización | Jadel Tech RD</title>" in html
          assert '<link rel="canonical" href="https://jadeltechrd.com/">' in html
          assert '<meta name="description" content="' in html

          sitemap = ElementTree.parse("sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = {node.text for node in sitemap.findall("sm:url/sm:loc", namespace)}
          expected = {
              "https://jadeltechrd.com/",
              "https://jadeltechrd.com/solicitar-proyecto.html",
              "https://jadeltechrd.com/agent-readiness.html",
              "https://jadeltechrd.com/whatsapp-ia-empresas-rd.html",
              "https://jadeltechrd.com/automatizacion-procesos-ia-rd.html",
              "https://jadeltechrd.com/agente-ventas-ia-rd.html",
              "https://jadeltechrd.com/?view=privacy",
              "https://jadeltechrd.com/?view=terms",
              "https://jadeltechrd.com/?view=data-deletion",
          }
          assert expected <= urls, f"Missing sitemap URLs: {sorted(expected - urls)}"

          robots = Path("robots.txt").read_text(encoding="utf-8")
          assert "User-agent: *" in robots
          assert "Allow: /" in robots
          assert "Sitemap: https://jadeltechrd.com/sitemap.xml" in robots

          print("COMMERCIAL_SEO_VALIDATION=PASS")
