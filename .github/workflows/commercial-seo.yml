name: Validate commercial SEO assets

on:
  pull_request:
    paths:
      - '.github/workflows/commercial-seo.yml'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate server-visible metadata and discovery files
        shell: python
        run: |
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from xml.etree import ElementTree

          class MetadataParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.meta = {}
                  self.title = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta":
                      key = attrs.get("name") or attrs.get("property")
                      if key:
                          self.meta[key] = attrs.get("content", "").strip()
                  elif tag == "title":
                      self.title = True

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.title = False

          html = Path("index.html").read_text(encoding="utf-8")
          parser = MetadataParser()
          parser.feed(html)
          title = re.search(r"<title>(.*?)</title>", html, re.I | re.S)
          assert title and title.group(1).strip(), "Title must be non-empty"
          assert title.group(1).strip() == "Agentes de IA & Automatización | Jadel Tech RD"
          assert '<link rel="canonical" href="https://jadeltechrd.com/">' in html
          assert parser.meta.get("description"), "Meta description must be non-empty"
          for key in (
              "og:type",
              "og:site_name",
              "og:title",
              "og:description",
              "og:url",
              "twitter:card",
              "twitter:title",
              "twitter:description",
          ):
              assert parser.meta.get(key), f"Missing or empty social metadata: {key}"

          sitemap = ElementTree.parse("sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = {node.text for node in sitemap.findall("sm:url/sm:loc", namespace)}
          expected = {
              "https://jadeltechrd.com/",
              "https://jadeltechrd.com/solicitar-proyecto.html",
              "https://jadeltechrd.com/agent-readiness.html",
              "https://jadeltechrd.com/whatsapp-ia-empresas-rd.html",
              "https://jadeltechrd.com/automatizacion-procesos-ia-rd.html",
              "https://jadeltechrd.com/agente-ventas-ia-rd.html",
              "https://jadeltechrd.com/?view=privacy",
              "https://jadeltechrd.com/?view=terms",
              "https://jadeltechrd.com/?view=data-deletion",
          }
          assert expected <= urls, f"Missing sitemap URLs: {sorted(expected - urls)}"

          robots = Path("robots.txt").read_text(encoding="utf-8")
          assert "User-agent: *" in robots
          assert "Allow: /" in robots
          assert "Sitemap: https://jadeltechrd.com/sitemap.xml" in robots

          print("COMMERCIAL_SEO_VALIDATION=PASS")
