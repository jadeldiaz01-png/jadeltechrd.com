name: Verify public site health

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Reconcile Cloudflare DNS for GitHub Pages
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-health.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  verify-public-access:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: jadeltechrd.com
    steps:
      - name: Verify public Cloudflare DNS with bounded propagation
        shell: bash
        run: |
          set -euo pipefail
          converged=false
          for attempt in $(seq 1 18); do
            actual=$(dig @1.1.1.1 +short A "$DOMAIN" | sort || true)
            printf 'DNS attempt %s/18:\n%s\n' "$attempt" "$actual"
            if [ -n "$actual" ] && ! grep -qE '^185\.199\.(108|109|110|111)\.153$' <<<"$actual"; then
              converged=true
              break
            fi
            sleep 10
          done
          if [ "$converged" != true ]; then
            echo 'Public DNS did not converge to the declared Cloudflare edge front door.' >&2
            exit 2
          fi
          echo 'DNS_RESOLUTION=PASS'
          echo 'CLOUDFLARE_EDGE_DNS=PASS'

      - name: Verify TLS and HTTP 200 gates with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://jadeltechrd.com/"
            "https://jadeltechrd.com/?view=privacy"
            "https://jadeltechrd.com/?view=terms"
            "https://jadeltechrd.com/?view=data-deletion"
          )

          success=false
          for attempt in $(seq 1 24); do
            echo "Public-access verification attempt ${attempt}/24"
            all_ok=true
            for url in "${urls[@]}"; do
              body=$(mktemp)
              meta=$(mktemp)
              if curl --silent --show-error --location --fail \
                --connect-timeout 8 --max-time 20 \
                --proto '=https' --tlsv1.2 \
                --output "$body" \
                --write-out '%{http_code}\t%{remote_ip}\t%{ssl_verify_result}' \
                "$url" >"$meta"; then
                code=''; remote=''; tls=''
                IFS=$'\t' read -r code remote tls <"$meta" || true
                echo "$url -> HTTP=$code remote=$remote tls_verify=$tls"
                if [ "$code" != 200 ] || [ "$tls" != 0 ] || [ ! -s "$body" ]; then
                  all_ok=false
                fi
              else
                echo "$url -> HTTPS/TLS request not ready" >&2
                all_ok=false
              fi
              rm -f "$body" "$meta"
            done
            if [ "$all_ok" = true ]; then success=true; break; fi
            sleep 15
          done

          if [ "$success" != true ]; then
            echo 'PUBLIC_ACCESS_READY=NO' >&2
            exit 1
          fi
          echo 'TLS_CERTIFICATE=PASS'
          echo 'HOME_HTTP_200=PASS'
          echo 'PRIVACY_HTTP_200=PASS'
          echo 'TERMS_HTTP_200=PASS'
          echo 'DATA_DELETION_HTTP_200=PASS'

      - name: Verify canonical application content
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp)
          app=$(mktemp)
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --proto '=https' --tlsv1.2 \
            --output "$home" "https://${DOMAIN}/"
          curl --fail --silent --show-error --location \
            --connect-timeout 8 --max-time 20 --proto '=https' --tlsv1.2 \
            --output "$app" "https://${DOMAIN}/app.js"
          grep -Fq 'Jadel Tech RD' "$home"
          grep -Fq 'data-deletion' "$app"
          rm -f "$home" "$app"
          echo 'HOME_CONTENT=PASS'
          echo 'DATA_DELETION_IMPLEMENTATION=PASS'
          echo 'PUBLIC_ACCESS_READY=YES'
