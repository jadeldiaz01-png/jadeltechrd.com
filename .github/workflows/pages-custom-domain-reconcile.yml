name: Reconcile GitHub Pages custom domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-custom-domain-reconcile.yml'

permissions:
  contents: read
  pages: write

jobs:
  reconcile-pages-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current Pages configuration
        id: before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          current=$(jq -r '.cname // empty' <<<"$response")
          echo "current_cname=${current:-<none>}"
          if [ "$current" = 'jadeltechrd.com' ]; then
            echo 'already_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set custom domain through official Pages API
        if: steps.before.outputs.already_configured != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"cname":"jadeltechrd.com","build_type":"workflow"}'
          tmp=$(mktemp)
          code=$(curl --silent --show-error -o "$tmp" -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data "$body" || true)
          if [ "$code" != '204' ]; then
            echo "Pages update rejected with HTTP ${code}." >&2
            jq -r '.message // empty' "$tmp" >&2 || true
            exit 2
          fi
          echo 'PAGES_CUSTOM_DOMAIN_MUTATION=PASS'

      - name: Verify custom domain persisted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
            cname=$(jq -r '.cname // empty' <<<"$response")
            if [ "$cname" = 'jadeltechrd.com' ]; then
              echo 'PAGES_CUSTOM_DOMAIN=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'PAGES_CUSTOM_DOMAIN=FAIL' >&2
          exit 3
