name: Guard canonical Pages custom domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-custom-domain-reconcile.yml'

permissions:
  contents: read
  pages: read

jobs:
  guard-pages-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Assert canonical repo does not own apex custom domain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          current=$(jq -r '.cname // empty' <<<"$response")
          echo "current_cname=${current:-<none>}"
          if [ "$current" = 'jadeltechrd.com' ]; then
            echo 'PAGES_CUSTOM_DOMAIN=FAIL canonical repo must not claim the apex domain.' >&2
            echo 'Keep jadeltechrd.com configured only on jadeldiaz01-png/jadeldiaz01-png.github.io.' >&2
            exit 2
          fi
          echo 'PAGES_CUSTOM_DOMAIN_CANONICAL_GUARD=PASS'
