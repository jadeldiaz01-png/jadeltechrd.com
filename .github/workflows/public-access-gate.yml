name: Public access gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-access-gate.yml'
  workflow_run:
    workflows:
      - Reconcile Cloudflare DNS for GitHub Pages
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: public-access-gate
  cancel-in-progress: true

jobs:
  verify-public-access:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: jadeltechrd.com
    steps:
      - name: Inspect authoritative DNS
        shell: bash
        run: |
          set -euo pipefail

          echo '=== NS ==='
          dig +short NS "$DOMAIN" | sort | tee /tmp/ns.txt
          echo '=== A via system resolver ==='
          dig +short A "$DOMAIN" | sort | tee /tmp/a.txt
          echo '=== A via Cloudflare 1.1.1.1 ==='
          dig @1.1.1.1 +short A "$DOMAIN" | sort | tee /tmp/a-cf.txt
          echo '=== A via Google 8.8.8.8 ==='
          dig @8.8.8.8 +short A "$DOMAIN" | sort | tee /tmp/a-google.txt

          test -s /tmp/ns.txt || { echo 'DNS_NS=FAIL'; exit 10; }
          test -s /tmp/a-cf.txt || { echo 'DNS_A_CLOUDFLARE=FAIL'; exit 11; }
          test -s /tmp/a-google.txt || { echo 'DNS_A_GOOGLE=FAIL'; exit 12; }
          ! grep -qE '^185\.199\.(108|109|110|111)\.153$' /tmp/a-cf.txt || { echo 'DNS_A_CLOUDFLARE=FAIL expected Cloudflare proxied edge, got direct GitHub Pages origin.'; exit 13; }
          ! grep -qE '^185\.199\.(108|109|110|111)\.153$' /tmp/a-google.txt || { echo 'DNS_A_GOOGLE=FAIL expected Cloudflare proxied edge, got direct GitHub Pages origin.'; exit 14; }
          echo 'DNS_RESOLUTION=PASS'
          echo 'CLOUDFLARE_EDGE_DNS=PASS'

      - name: Wait for Cloudflare edge TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          cert=$(mktemp)
          timeout 20 openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" </dev/null 2>/tmp/tls.err \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName >"$cert"
          grep -Fq "DNS:$DOMAIN" "$cert"
          cat "$cert"
          echo 'TLS_CERTIFICATE=PASS'

      - name: Verify public HTTP endpoints
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://${DOMAIN}/"
            "https://${DOMAIN}/?view=privacy"
            "https://${DOMAIN}/?view=terms"
            "https://${DOMAIN}/?view=data-deletion"
          )
          labels=(HOME_HTTP_200 PRIVACY_HTTP_200 TERMS_HTTP_200 DATA_DELETION_HTTP_200)
          for i in "${!urls[@]}"; do
            body=$(mktemp)
            code=$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 \
              --output "$body" --write-out '%{http_code}' "${urls[$i]}" || true)
            echo "${labels[$i]}=${code}"
            test "$code" = '200'
            test -s "$body"
          done
          echo 'PUBLIC_ACCESS_READY=PASS'
