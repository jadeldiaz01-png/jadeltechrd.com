name: Diagnose Cloudflare Environment Secret Name

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-secret-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    environment:
      name: jadeltechrd
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      S1: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      S2: ${{ secrets.CF_API_TOKEN != '' }}
      S3: ${{ secrets.CLOUDFLARE_TOKEN != '' }}
      S4: ${{ secrets.CF_TOKEN != '' }}
      S5: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN != '' }}
      S6: ${{ secrets.CF_DNS_API_TOKEN != '' }}
      S7: ${{ secrets.CLOUDFLARE_DNS_TOKEN != '' }}
      S8: ${{ secrets.CLOUDFLARE_API_KEY != '' }}
      S9: ${{ secrets.CF_API_KEY != '' }}
      S10: ${{ secrets.DNS_API_TOKEN != '' }}
      S11: ${{ secrets.API_TOKEN != '' }}
      S12: ${{ secrets.TOKEN != '' }}
      V1: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
      V2: ${{ vars.CF_API_TOKEN != '' }}
      V3: ${{ vars.CLOUDFLARE_TOKEN != '' }}
      V4: ${{ vars.CF_TOKEN != '' }}
      V5: ${{ vars.CLOUDFLARE_DNS_API_TOKEN != '' }}
      V6: ${{ vars.CF_DNS_API_TOKEN != '' }}
      V7: ${{ vars.CLOUDFLARE_DNS_TOKEN != '' }}
      V8: ${{ vars.CLOUDFLARE_API_KEY != '' }}
      V9: ${{ vars.CF_API_KEY != '' }}
      V10: ${{ vars.DNS_API_TOKEN != '' }}
      V11: ${{ vars.API_TOKEN != '' }}
      V12: ${{ vars.TOKEN != '' }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          echo 'Environment=jadeltechrd'
          echo "secret.CLOUDFLARE_API_TOKEN=$S1"
          echo "secret.CF_API_TOKEN=$S2"
          echo "secret.CLOUDFLARE_TOKEN=$S3"
          echo "secret.CF_TOKEN=$S4"
          echo "secret.CLOUDFLARE_DNS_API_TOKEN=$S5"
          echo "secret.CF_DNS_API_TOKEN=$S6"
          echo "secret.CLOUDFLARE_DNS_TOKEN=$S7"
          echo "secret.CLOUDFLARE_API_KEY=$S8"
          echo "secret.CF_API_KEY=$S9"
          echo "secret.DNS_API_TOKEN=$S10"
          echo "secret.API_TOKEN=$S11"
          echo "secret.TOKEN=$S12"
          echo "variable.CLOUDFLARE_API_TOKEN=$V1"
          echo "variable.CF_API_TOKEN=$V2"
          echo "variable.CLOUDFLARE_TOKEN=$V3"
          echo "variable.CF_TOKEN=$V4"
          echo "variable.CLOUDFLARE_DNS_API_TOKEN=$V5"
          echo "variable.CF_DNS_API_TOKEN=$V6"
          echo "variable.CLOUDFLARE_DNS_TOKEN=$V7"
          echo "variable.CLOUDFLARE_API_KEY=$V8"
          echo "variable.CF_API_KEY=$V9"
          echo "variable.DNS_API_TOKEN=$V10"
          echo "variable.API_TOKEN=$V11"
          echo "variable.TOKEN=$V12"
