name: Certify D1 LIVE read-only access

on:
  pull_request:
    paths:
      - .github/workflows/d1-live-readonly-preflight.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/d1-live-readonly-preflight.yml
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main SHA
        required: true
        type: string
      confirmation:
        description: Type VERIFY_D1_LIVE_READONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: d1-live-readonly-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout immutable code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate read-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/d1-live-readonly-preflight.yml").read_text()
          probe = text.split("\n  probe:\n", 1)[1]
          required = [
              "name: d1-live-readonly-audit",
              "CLOUDFLARE_D1_READONLY_API_TOKEN_RAW:",
              "SELECT 1 AS readonly_probe",
              "/d1/database",
              "/query",
              "rows_written",
              "refs/heads/main",
              "GITHUB_SHA",
          ]
          for item in required:
              assert item in probe, f"MISSING_READONLY_CONTROL={item}"
          for forbidden in ["INSERT INTO", "UPDATE ", "DELETE FROM", "DROP TABLE", "ALTER TABLE",
                            "CREATE TABLE", "/capture", "/refund", "wrangler deploy", "git push"]:
              assert forbidden not in probe, f"FORBIDDEN_MUTATION={forbidden}"
          assert "CLOUDFLARE_D1_API_TOKEN_RAW" not in probe
          print("D1_LIVE_READONLY_CONTRACT=PASS")
          PY

  probe:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'VERIFY_D1_LIVE_READONLY')) }}
    needs: contract
    environment:
      name: d1-live-readonly-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
      CLOUDFLARE_D1_READONLY_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_D1_READONLY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_DB_NAME: jadel-commercial-runtime
    steps:
      - name: Checkout approved main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify main and perform authenticated SELECT 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          git fetch --no-tags https://github.com/${GITHUB_REPOSITORY}.git +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"

          token=$(printf '%s' "$CLOUDFLARE_D1_READONLY_API_TOKEN_RAW" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          account=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '\r\n[:space:]')
          test -n "$token"
          [[ "$account" =~ ^[0-9a-fA-F]{32}$ ]]
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          auth=(-H "Authorization: Bearer $token" -H "Content-Type: application/json")

          list_code=$(curl -sS -o /tmp/d1-list.json -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$account/d1/database?name=$EXPECTED_DB_NAME&per_page=100")
          test "$list_code" = 200
          jq -e '.success == true' /tmp/d1-list.json >/dev/null
          jq -e --arg name "$EXPECTED_DB_NAME" '[.result[] | select(.name==$name)] | length == 1' /tmp/d1-list.json >/dev/null
          db_id=$(jq -r --arg name "$EXPECTED_DB_NAME" '.result[] | select(.name==$name) | .uuid' /tmp/d1-list.json)
          [[ "$db_id" =~ ^[0-9a-fA-F-]{36}$ ]]
          echo "::add-mask::$db_id"

          query_payload='{"sql":"SELECT 1 AS readonly_probe"}'
          query_code=$(curl -sS -o /tmp/d1-query.json -w '%{http_code}' -X POST "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$account/d1/database/$db_id/query" --data "$query_payload")
          test "$query_code" = 200
          jq -e '.success == true and ([.result[].results[]? | select(.readonly_probe == 1)] | length) == 1 and ([.result[].meta.rows_written // 0] | add) == 0' /tmp/d1-query.json >/dev/null

          echo 'D1_LIVE_READONLY_AUTHENTICATED=PASS'
          echo 'D1_LIVE_DB_NAME_MATCH=PASS'
          echo 'D1_LIVE_SELECT_1=PASS'
          echo 'D1_ROWS_WRITTEN=0'
          {
            echo '## D1 LIVE read-only preflight'
            echo '- Account and exact production D1 name: MATCH'
            echo '- Authenticated SQL SELECT 1: PASS'
            echo '- Reported rows written: 0'
            echo '- Credential permission policy (absence of D1 Write): NOT DETERMINABLE BY QUERY; REVIEW TOKEN POLICY IN CLOUDFLARE'
            echo '- PayPal calls, captures, deployments: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
