name: Runtime User AGIA Home Once

on:
  push:
    branches:
      - 'ops/runtime-user-agia-home-72c3b3fb'
    paths:
      - '.github/workflows/runtime-user-agia-home-once.yml'

permissions:
  contents: read

concurrency:
  group: runtime-user-agia-home-once
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare AGIA home as runtime-gateway-deploy
    runs-on: [self-hosted, linux, x64, jadel-agent-runtime]
    timeout-minutes: 10
    environment: production-bootstrap
    env:
      EXPECTED_WEB_MAIN: '72c3b3fb183a988c59de3d5af54484c6c6e0db26'
      EXPECTED_RUNTIME_MAIN: 'db6466761fc23c5021b9a99115dd08e923887cf9'
      EXPECTED_PREP_BLOB: '95b67697e416d60bbcaab9d4fdecf7dee1fb861f'
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - name: Checkout one-shot bridge revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Enforce exact bridge lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_WEB_MAIN"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/runtime-user-agia-home-once.yml'
          echo "RUNTIME_USER_BRIDGE_LINEAGE=PASS"
          echo "RUNTIME_SOURCE_SHA=$EXPECTED_RUNTIME_MAIN"

      - name: Materialize immutable PREPARE_HOME_ONLY payload
        shell: bash
        env:
          PREP_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PREP_B64" | base64 -d > "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh"
          chmod 700 "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh"
          test "$(git hash-object "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh")" = "$EXPECTED_PREP_BLOB"
          bash -n "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh"
          echo "PREPARE_HOME_PAYLOAD_INTEGRITY=PASS"

      - name: Resolve self Tailscale and SSH trust
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          case "$VPS_USER" in root) echo "refusing root SSH user" >&2; exit 1;; esac
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_PRIVATE_KEY_PASSPHRASE"
          command -v tailscale >/dev/null
          test "$(tailscale status --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("BackendState",""))')" = Running
          TAILSCALE_IP="$(tailscale ip -4 | head -n1)"
          [[ "$TAILSCALE_IP" =~ ^100\. ]]
          printf 'TAILSCALE_IP=%s\n' "$TAILSCALE_IP" >> "$GITHUB_ENV"
          test -r /etc/ssh/ssh_host_ed25519_key.pub
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519"
          awk -v host="$TAILSCALE_IP" '{print host" "$1" "$2}' /etc/ssh/ssh_host_ed25519_key.pub > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          askpass="$RUNNER_TEMP/ssh/askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY_PASSPHRASE:?}"
          ASKPASS
          chmod 0700 "$askpass"
          DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$RUNNER_TEMP/ssh/id_ed25519" </dev/null >/dev/null
          echo "SELF_TAILSCALE_SSH_TRUST=PASS"

      - name: Verify runtime-gateway-deploy privilege chain
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "id runtime-gateway-deploy >/dev/null && sudo -n -u runtime-gateway-deploy true && sudo -n -u runtime-gateway-deploy bash -c 'sudo -n -l /usr/local/sbin/agia-runner-bootstrap >/dev/null'"
          echo "RUNTIME_GATEWAY_DEPLOY_PRIVILEGE_CHAIN=PASS"

      - name: Stage payload as runtime-gateway-deploy
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "sudo -n -u runtime-gateway-deploy sh -c 'cat > /tmp/bootstrap_agia_production_runner.sh && chmod 700 /tmp/bootstrap_agia_production_runner.sh'"             < "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh"
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "test \"\$(stat -c '%U:%G %a' /tmp/bootstrap_agia_production_runner.sh)\" = 'runtime-gateway-deploy:runtime-gateway-deploy 700'"
          echo "RUNTIME_GATEWAY_DEPLOY_STAGED_PAYLOAD=PASS"

      - name: Prepare dedicated AGIA home through governed helper
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          set +e
          out="$(printf '%s\n' PREPARE_HOME_ONLY | "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP"             "sudo -n -u runtime-gateway-deploy bash -c 'sudo -n /usr/local/sbin/agia-runner-bootstrap'")"
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          grep -qx 'AGIA_PRODUCTION_CERTIFIER_HOME_PREPARE_ONLY=PASS' <<<"$out"
          grep -qx 'RUNNER_HOME=/opt/actions-runners/agia-production-certifier' <<<"$out"
          grep -qx 'RUNNER_VERSION=2.337.0' <<<"$out"
          grep -qx 'LEGACY_JADEL_AGENT_RUNTIME_PRESERVED=PASS' <<<"$out"
          grep -qx 'P4H_PRESERVED=PASS' <<<"$out"
          grep -qx 'RUNNER_REGISTRATION_PERFORMED=NO' <<<"$out"
          grep -qx 'RUNNER_SERVICE_INSTALL_PERFORMED=NO' <<<"$out"
          grep -qx 'RUNNER_SERVICE_START_PERFORMED=NO' <<<"$out"
          echo "RUNTIME_USER_AGIA_HOME_PREPARE=PASS"

      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -rf "$RUNNER_TEMP/ssh"
          rm -f "$RUNNER_TEMP/prepare_agia_production_certifier_home.sh"
