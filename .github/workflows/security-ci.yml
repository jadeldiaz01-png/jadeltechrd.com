name: Security baseline CI

on:
  push:
    branches: [main, security/hardening-2026]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate web source security
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          grep -Fq 'http-equiv="Content-Security-Policy"' index.html
          grep -Fq "default-src 'none'" index.html
          grep -Fq "script-src 'self'" index.html
          grep -Fq "object-src 'none'" index.html
          grep -Fq "base-uri 'none'" index.html
          grep -Fq "form-action 'self'" index.html
          grep -Fq 'strict-origin-when-cross-origin' index.html
          if grep -nE '<[^>]+ on[a-zA-Z]+=' index.html; then
            echo 'INLINE_EVENT_HANDLER=FAIL'
            exit 1
          fi
          if grep -nE '\beval\s*\(|new Function\s*\(|document\.write\s*\(' app.js; then
            echo 'DANGEROUS_JS_PRIMITIVE=FAIL'
            exit 1
          fi
          if grep -nE '(src|href)="http://' index.html; then
            echo 'INSECURE_RESOURCE_REFERENCE=FAIL'
            exit 1
          fi
          if grep -Fq 'paypal.com/ncp/payment/' index.html || grep -Fq 'paypal.com/ncp/payment/' app.js; then
            echo 'UNTRACKED_PUBLIC_PAYPAL_LINK=FAIL'
            exit 1
          fi
          ! grep -Fq 'PAYMENT_LINKS' app.js
          grep -Fq 'checkout PayPal único asociado a tu cotización' index.html
          echo 'GOVERNED_PUBLIC_CHECKOUT_ONLY=PASS'
          echo 'SOURCE_SECURITY=PASS'
      - name: Require immutable GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          failures=[]
          for path in Path('.github/workflows').glob('*.y*ml'):
              for i,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  m=re.search(r'\buses:\s*([^\s#]+)', line)
                  if not m:
                      continue
                  ref=m.group(1)
                  if ref.startswith('./'):
                      continue
                  if not re.search(r'@[0-9a-fA-F]{40}$', ref):
                      failures.append(f'{path}:{i}: {ref}')
          if failures:
              print('UNPINNED_ACTIONS=FAIL')
              print('\n'.join(failures))
              raise SystemExit(1)
          print('IMMUTABLE_ACTIONS=PASS')
          PY
      - name: Require Node 24 compatible GitHub Actions pins
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_github_actions_runtime_pins.py
      - name: Validate commercial runtime deploy governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/deploy-commercial-runtime.yml")
          text = path.read_text(encoding="utf-8")

          def require(fragment, label):
              if fragment not in text:
                  raise SystemExit(f"{label}=FAIL")

          if re.search(r"^\s*push:\s*$", text, re.MULTILINE):
              raise SystemExit("COMMERCIAL_RUNTIME_AUTO_PUSH_DEPLOY=FAIL")

          require("workflow_dispatch:", "COMMERCIAL_RUNTIME_WORKFLOW_DISPATCH")
          require("expected_sha:", "COMMERCIAL_RUNTIME_EXPECTED_SHA_INPUT")
          require("confirmation:", "COMMERCIAL_RUNTIME_CONFIRMATION_INPUT")
          require("DEPLOY_COMMERCIAL_RUNTIME", "COMMERCIAL_RUNTIME_CONFIRMATION_VALUE")
          require('test "$GITHUB_REF" = "refs/heads/main"', "COMMERCIAL_RUNTIME_MAIN_REF_GATE")
          require('test "$GITHUB_SHA" = "$EXPECTED_SHA"', "COMMERCIAL_RUNTIME_DISPATCH_SHA_GATE")
          require("PROTECTED_MAIN_SHA_MATCH=PASS", "COMMERCIAL_RUNTIME_MAIN_SHA_RECHECK")
          require("D1_MUTATION_SHA_GATE=PASS", "COMMERCIAL_RUNTIME_D1_SHA_GATE")
          require("WORKER_MUTATION_SHA_GATE=PASS", "COMMERCIAL_RUNTIME_WORKER_SHA_GATE")
          require('PAYPAL_ENVIRONMENT:"live"', "COMMERCIAL_RUNTIME_PAYPAL_ENVIRONMENT")
          require('PAYPAL_ORDER_CREATION_ENABLED:"false"', "COMMERCIAL_RUNTIME_PAYPAL_ORDER_CREATION")
          require('PAYPAL_LIVE_ORDER_CREATION_ENABLED:"false"', "COMMERCIAL_RUNTIME_PAYPAL_LIVE_ORDER_CREATION")
          require('PRODUCTION_AUTHORIZED:"false"', "COMMERCIAL_RUNTIME_PRODUCTION_AUTHORITY")
          require('FINANCIAL_EXECUTION_AUTHORIZED:"false"', "COMMERCIAL_RUNTIME_FINANCIAL_AUTHORITY")
          require('MAX_AUTONOMOUS_CAPITAL_USD:"0"', "COMMERCIAL_RUNTIME_CAPITAL_GUARD")

          print("COMMERCIAL_RUNTIME_DEPLOY_GOVERNANCE=PASS")
          PY

      - name: Validate PayPal LIVE webhook credential governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/configure-paypal-live-webhook.yml")
          text = path.read_text(encoding="utf-8")

          def require(fragment, label):
              if fragment not in text:
                  raise SystemExit(f"{label}=FAIL")

          def forbid(fragment, label):
              if fragment in text:
                  raise SystemExit(f"{label}=FAIL")

          if re.search(r"^\s*push:\s*$", text, re.MULTILINE):
              raise SystemExit("PAYPAL_LIVE_WEBHOOK_AUTO_PUSH=FAIL")
          if re.search(r"^\s*schedule:\s*$", text, re.MULTILINE):
              raise SystemExit("PAYPAL_LIVE_WEBHOOK_SCHEDULE=FAIL")

          require("workflow_dispatch:", "PAYPAL_LIVE_WEBHOOK_WORKFLOW_DISPATCH")
          require("expected_sha:", "PAYPAL_LIVE_WEBHOOK_EXPECTED_SHA")
          require("confirmation:", "PAYPAL_LIVE_WEBHOOK_CONFIRMATION_INPUT")
          require("CONFIGURE_PAYPAL_LIVE_WEBHOOK", "PAYPAL_LIVE_WEBHOOK_CONFIRMATION_VALUE")
          require('test "$GITHUB_REF" = "refs/heads/main"', "PAYPAL_LIVE_WEBHOOK_MAIN_REF_GATE")
          require('test "$GITHUB_SHA" = "$EXPECTED_SHA"', "PAYPAL_LIVE_WEBHOOK_DISPATCH_SHA_GATE")
          require("PAYPAL_LIVE_AUTHORITY_FAIL_CLOSED=PASS", "PAYPAL_LIVE_WEBHOOK_AUTHORITY_GATE")

          require("secrets.PAYPAL_CLIENT_ID", "PAYPAL_LIVE_CLIENT_ID_SECRET_SOURCE")
          require("secrets.PAYPAL_CLIENT_SECRET", "PAYPAL_LIVE_CLIENT_SECRET_SOURCE")
          require("secrets.PAYPAL_WEBHOOK_ID", "PAYPAL_LIVE_WEBHOOK_ID_SECRET_SOURCE")

          for name in ("PAYPAL_CLIENT_ID", "PAYPAL_CLIENT_SECRET", "PAYPAL_WEBHOOK_ID"):
              require(f"wrangler secret put {name}", f"{name}_PUT")
              require(f"{name}_RECONCILED=PASS", f"{name}_RECONCILE_EVIDENCE")

          require("PAYPAL_LIVE_WEBHOOK_INVALID_SIGNATURE_CANARY=PASS", "PAYPAL_LIVE_WEBHOOK_403_CANARY")
          require('test "$code" = 403', "PAYPAL_LIVE_WEBHOOK_403_ASSERTION")
          require('"PAYPAL_WEBHOOK_REJECTED"', "PAYPAL_LIVE_WEBHOOK_REJECTION_ASSERTION")

          forbid("wrangler deploy", "PAYPAL_LIVE_WEBHOOK_GENERAL_DEPLOY")
          forbid("secret delete", "PAYPAL_LIVE_WEBHOOK_SECRET_DELETE")
          forbid("secret bulk", "PAYPAL_LIVE_WEBHOOK_SECRET_BULK")
          forbid("actions/upload-artifact", "PAYPAL_LIVE_WEBHOOK_ARTIFACT")
          forbid("PAYPAL_ORDER_CREATION_ENABLED --name", "PAYPAL_ORDER_CREATION_SECRET_MUTATION")
          forbid("PAYPAL_LIVE_ORDER_CREATION_ENABLED --name", "PAYPAL_LIVE_ORDER_CREATION_SECRET_MUTATION")
          forbid("PRODUCTION_AUTHORIZED --name", "PRODUCTION_AUTHORIZED_SECRET_MUTATION")
          forbid("FINANCIAL_EXECUTION_AUTHORIZED --name", "FINANCIAL_EXECUTION_AUTHORIZED_SECRET_MUTATION")
          forbid("MAX_AUTONOMOUS_CAPITAL_USD --name", "MAX_AUTONOMOUS_CAPITAL_SECRET_MUTATION")

          puts = re.findall(r"wrangler\s+secret\s+put\s+([A-Z0-9_]+)", text)
          if puts != ["PAYPAL_CLIENT_ID", "PAYPAL_CLIENT_SECRET", "PAYPAL_WEBHOOK_ID"]:
              raise SystemExit(f"PAYPAL_LIVE_WEBHOOK_SECRET_SCOPE=FAIL actual={puts}")

          deploy = Path(".github/workflows/deploy-commercial-runtime.yml").read_text(encoding="utf-8")
          for fragment, label in [
              ('PAYPAL_ORDER_CREATION_ENABLED:"false"', "PAYPAL_ORDER_CREATION_DISABLED"),
              ('PAYPAL_LIVE_ORDER_CREATION_ENABLED:"false"', "PAYPAL_LIVE_ORDER_CREATION_DISABLED"),
              ('PRODUCTION_AUTHORIZED:"false"', "PRODUCTION_AUTHORIZED_FALSE"),
              ('FINANCIAL_EXECUTION_AUTHORIZED:"false"', "FINANCIAL_EXECUTION_AUTHORIZED_FALSE"),
              ('MAX_AUTONOMOUS_CAPITAL_USD:"0"', "MAX_AUTONOMOUS_CAPITAL_ZERO"),
          ]:
              if fragment not in deploy:
                  raise SystemExit(f"{label}=FAIL")

          print("PAYPAL_LIVE_WEBHOOK_CREDENTIAL_GOVERNANCE=PASS")
          PY

      - name: Validate PayPal LIVE production workflow governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflows = {
              "readiness": Path(".github/workflows/paypal-live-readiness.yml"),
              "activate": Path(".github/workflows/paypal-live-activate.yml"),
              "capture": Path(".github/workflows/paypal-live-capture.yml"),
          }

          def require(text, fragment, label):
              if fragment not in text:
                  raise SystemExit(f"{label}=FAIL")

          def manual_only(text, label):
              if not re.search(r"^on:\s*\n\s+workflow_dispatch:", text, re.MULTILINE):
                  raise SystemExit(f"{label}_DISPATCH=FAIL")
              if re.search(r"^\s*push:\s*$", text, re.MULTILINE):
                  raise SystemExit(f"{label}_PUSH=FAIL")
              if re.search(r"^\s*schedule:\s*$", text, re.MULTILINE):
                  raise SystemExit(f"{label}_SCHEDULE=FAIL")

          readiness = workflows["readiness"].read_text(encoding="utf-8")
          activation = workflows["activate"].read_text(encoding="utf-8")
          capture = workflows["capture"].read_text(encoding="utf-8")

          manual_only(readiness, "PAYPAL_LIVE_READINESS")
          require(readiness, "VERIFY_PAYPAL_LIVE_READINESS", "PAYPAL_LIVE_READINESS_CONFIRMATION")
          require(readiness, 'test "$GITHUB_SHA" = "$EXPECTED_SHA"', "PAYPAL_LIVE_READINESS_SHA")
          require(readiness, "PAYPAL_LIVE_READINESS=PASS", "PAYPAL_LIVE_READINESS_EVIDENCE")
          if "$PAYPAL_LIVE_API/v2/checkout/orders/" in readiness:
              raise SystemExit("PAYPAL_LIVE_READINESS_PROVIDER_ORDER_CALL=FAIL")

          manual_only(activation, "PAYPAL_LIVE_ACTIVATION")
          require(activation, "ACTIVATE_PAYPAL_LIVE_ORDER_CREATION", "PAYPAL_LIVE_ACTIVATION_CONFIRMATION")
          require(activation, 'test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"', "PAYPAL_LIVE_ACTIVATION_SHA")
          require(activation, 'PAYPAL_ENVIRONMENT:"live"', "PAYPAL_LIVE_ACTIVATION_ENV")
          require(activation, 'PAYPAL_ORDER_CREATION_ENABLED:"true"', "PAYPAL_LIVE_ACTIVATION_ORDER_FLAG")
          require(activation, 'PAYPAL_LIVE_ORDER_CREATION_ENABLED:"true"', "PAYPAL_LIVE_ACTIVATION_LIVE_FLAG")
          require(activation, 'PRODUCTION_AUTHORIZED:"true"', "PAYPAL_LIVE_ACTIVATION_PRODUCTION_FLAG")
          require(activation, 'FINANCIAL_EXECUTION_AUTHORIZED:"false"', "PAYPAL_LIVE_ACTIVATION_FINANCIAL_BOUNDARY")
          require(activation, 'MAX_AUTONOMOUS_CAPITAL_USD:"0"', "PAYPAL_LIVE_ACTIVATION_CAPITAL_BOUNDARY")
          if "$PAYPAL_LIVE_API/v2/checkout/orders/" in activation:
              raise SystemExit("PAYPAL_LIVE_ACTIVATION_PROVIDER_ORDER_CALL=FAIL")

          manual_only(capture, "PAYPAL_LIVE_CAPTURE")
          require(capture, "CAPTURE_PAYPAL_LIVE_ORDER", "PAYPAL_LIVE_CAPTURE_CONFIRMATION")
          require(capture, "paypal_order_id:", "PAYPAL_LIVE_CAPTURE_PROVIDER_ID")
          require(capture, "payment_order_id:", "PAYPAL_LIVE_CAPTURE_INTERNAL_ID")
          require(capture, "quote_id:", "PAYPAL_LIVE_CAPTURE_QUOTE_ID")
          require(capture, 'test "$status" = APPROVED', "PAYPAL_LIVE_CAPTURE_APPROVED_GATE")
          require(capture, "PayPal-Request-Id: jadel-live-capture-$PAYMENT_ORDER_ID", "PAYPAL_LIVE_CAPTURE_IDEMPOTENCY")
          require(capture, "/v2/checkout/orders/$PAYPAL_ORDER_ID/capture", "PAYPAL_LIVE_CAPTURE_ENDPOINT")
          require(capture, "PAYPAL_LIVE_SIGNED_WEBHOOK=PASS", "PAYPAL_LIVE_CAPTURE_WEBHOOK_EVIDENCE")
          if "/api/v1/admin/payments/reconcile" in capture:
              raise SystemExit("PAYPAL_LIVE_CAPTURE_AUTO_RECONCILE=FAIL")

          print("PAYPAL_LIVE_PRODUCTION_WORKFLOW_GOVERNANCE=PASS")
          PY

      - name: Validate GitHub Pages deploy governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".github/workflows/pages.yml")
          text = path.read_text(encoding="utf-8")

          def require(fragment, label):
              if fragment not in text:
                  raise SystemExit(f"{label}=FAIL")

          lines = text.splitlines()
          on_index = next(
              (i for i, line in enumerate(lines) if re.match(r"^on:\s*$", line)),
              None,
          )
          if on_index is None:
              raise SystemExit("PAGES_ON_BLOCK=FAIL")

          on_indent = len(lines[on_index]) - len(lines[on_index].lstrip())
          trigger_keys = set()
          for line in lines[on_index + 1:]:
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  continue
              indent = len(line) - len(line.lstrip())
              if indent <= on_indent:
                  break
              if indent == on_indent + 2:
                  match = re.match(r"([A-Za-z_][A-Za-z0-9_-]*)\s*:", stripped)
                  if match:
                      trigger_keys.add(match.group(1))

          if trigger_keys != {"workflow_dispatch"}:
              raise SystemExit(
                  "PAGES_TRIGGER_KEYS=FAIL actual=" + ",".join(sorted(trigger_keys))
              )

          require("workflow_dispatch:", "PAGES_WORKFLOW_DISPATCH")
          require("expected_sha:", "PAGES_EXPECTED_SHA_INPUT")
          require("confirmation:", "PAGES_CONFIRMATION_INPUT")
          require("DEPLOY_PUBLIC_SITE", "PAGES_CONFIRMATION_VALUE")
          require('test "$GITHUB_REF" = "refs/heads/main"', "PAGES_MAIN_REF_GATE")
          require('test "$GITHUB_SHA" = "$EXPECTED_SHA"', "PAGES_DISPATCH_SHA_GATE")
          require("PAGES_PROTECTED_MAIN_SHA_MATCH=PASS", "PAGES_MAIN_SHA_RECHECK")
          expected_checkout_ref = "ref: $" + "{{ inputs.expected_sha }}"
          require(expected_checkout_ref, "PAGES_IMMUTABLE_CHECKOUT")
          require("actions/deploy-pages@", "PAGES_DEPLOY_ACTION")
          require("public_assets=(", "PAGES_PUBLIC_ASSET_ALLOWLIST")
          require("approval-console.html", "PAGES_APPROVAL_CONSOLE_HTML")
          require("approval-console.js", "PAGES_APPROVAL_CONSOLE_JS")
          if "find . -mindepth 1 -maxdepth 1" in text:
              raise SystemExit("PAGES_BROAD_ROOT_COPY=FAIL")

          print("PAGES_DEPLOY_GOVERNANCE=PASS")
          PY

      - name: Validate pilot-agent production readiness contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_agent_production_readiness.py
      - name: Browser smoke under CSP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/jadel-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=2500 \
            --dump-dom http://127.0.0.1:8765/ >/tmp/dom.html
          grep -Fq 'Convierte trabajo repetitivo en' /tmp/dom.html
          grep -Fq 'Multi-Agent Orchestration' /tmp/dom.html
          grep -Fq 'Supervisión humana' /tmp/dom.html
          echo 'CSP_BROWSER_SMOKE=PASS'
