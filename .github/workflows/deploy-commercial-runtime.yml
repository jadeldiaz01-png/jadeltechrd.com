name: Deploy commercial runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'commercial-runtime/**'
      - '.github/workflows/deploy-commercial-runtime.yml'

permissions:
  contents: read

env:
  DOMAIN: jadeltechrd.com
  API_HOST: intake.jadeltechrd.com
  WORKER_NAME: jadel-commercial-runtime
  D1_NAME: jadel-commercial-runtime
  WRANGLER_VERSION: 4.127.1

jobs:
  prepare-production-d1:
    environment:
      name: d1-recovery-drill
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      account_hash: ${{ steps.d1.outputs.account_hash }}
      database_id: ${{ steps.d1.outputs.database_id }}
      database_hash: ${{ steps.d1.outputs.database_hash }}
    env:
      CLOUDFLARE_D1_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Normalize and verify dedicated D1 credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_D1_API_TOKEN_RAW:-}"
          token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$token" == \"*\" && "$token" == *\" ]]; then token="${token:1:${#token}-2}"; fi
          if [[ "$token" == \'*\' && "$token" == *\' ]]; then token="${token:1:${#token}-2}"; fi
          account_id=$(printf '%s' "${CLOUDFLARE_ACCOUNT_ID_RAW:-}" | tr -d '\r\n[:space:]')
          test -n "$token" || { echo 'CLOUDFLARE_D1_TOKEN_PRESENT=NO' >&2; exit 2; }
          test -n "$account_id" || { echo 'CLOUDFLARE_ACCOUNT_ID_PRESENT=NO' >&2; exit 2; }
          case "$token" in
            cfat_*) ;;
            *) echo 'CLOUDFLARE_D1_TOKEN_FAMILY=FAIL expected=account_token' >&2; exit 2 ;;
          esac
          echo "::add-mask::$token"
          verify=$(curl --fail-with-body -sS -H "Authorization: Bearer $token"             "https://api.cloudflare.com/client/v4/accounts/$account_id/tokens/verify")
          test "$(jq -r '.success' <<<"$verify")" = true
          test "$(jq -r '.result.status' <<<"$verify")" = active
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"
          echo 'CLOUDFLARE_D1_TOKEN_VERIFY=PASS'

      - name: Resolve existing production D1 fail-closed
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}' "${auth[@]}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=${D1_NAME}&per_page=100" || true)
          if [ "$code" != 200 ]; then
            echo "D1_ACCESS=FAIL_HTTP_${code}" >&2
            jq -r '.errors[]? | "Cloudflare error code=\(.code) message=\(.message)"' "$tmp" >&2 || true
            exit 10
          fi
          test "$(jq -r '.success' "$tmp")" = true
          matches=$(jq -r --arg n "$D1_NAME" '[.result[] | select(.name==$n)] | length' "$tmp")
          if [ "$matches" != 1 ]; then
            echo "PRODUCTION_D1_IDENTITY=FAIL expected_exactly_one actual=${matches}" >&2
            exit 20
          fi
          database_id=$(jq -r --arg n "$D1_NAME" '.result[] | select(.name==$n) | .uuid' "$tmp")
          test -n "$database_id" && test "$database_id" != null
          account_hash=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | awk '{print $1}')
          database_hash=$(printf '%s' "$database_id" | sha256sum | awk '{print $1}')
          # Resource identifiers are passed only through GitHub job outputs. They are
          # not authentication credentials and are deliberately not add-mask'ed,
          # because GitHub suppresses masked values from cross-job outputs.
          echo "account_hash=$account_hash" >> "$GITHUB_OUTPUT"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "database_hash=$database_hash" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_D1_ACCOUNT_HASH=$account_hash"
          echo "PRODUCTION_D1_DATABASE_HASH=$database_hash"
          echo 'PRODUCTION_D1_IDENTITY=PASS'

      - name: Generate D1 migration configuration
        shell: bash
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_ID"
          jq -n --arg db "$DATABASE_ID" '{
            "$schema":"./node_modules/wrangler/config-schema.json",
            name:"jadel-commercial-runtime-d1-migrations",
            compatibility_date:"2026-08-31",
            d1_databases:[{
              binding:"DB",
              database_name:"jadel-commercial-runtime",
              database_id:$db,
              migrations_dir:"migrations"
            }]
          }' > commercial-runtime/wrangler.d1.jsonc
          jq -e '.d1_databases[0].database_id | length > 10' commercial-runtime/wrangler.d1.jsonc >/dev/null
          echo 'D1_MIGRATION_CONFIG=PASS'

      - name: Install pinned Wrangler
        shell: bash
        working-directory: commercial-runtime
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "wrangler@${WRANGLER_VERSION}"
          actual=$(npx wrangler --version | tr -d '\r\n[:space:]')
          test "$actual" = "$WRANGLER_VERSION" || { echo "WRANGLER_VERSION_MISMATCH expected=$WRANGLER_VERSION actual=$actual" >&2; exit 40; }
          echo "WRANGLER_VERSION=PASS version=${actual}"

      - name: Apply additive D1 migrations
        shell: bash
        working-directory: commercial-runtime
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$D1_NAME" --remote --config wrangler.d1.jsonc
          echo 'D1_MIGRATIONS=PASS'

      - name: Verify production D1 schema
        shell: bash
        env:
          DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          schema=$(curl --fail-with-body -sS -X POST "${auth[@]}"             "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"             --data '{"sql":"SELECT name FROM sqlite_master WHERE type=\"table\" ORDER BY name"}')
          test "$(jq -r '.success' <<<"$schema")" = true
          for table in project_requests evidence_events dispatch_outbox payment_events payment_ledger approval_events lead_lifecycle_events revenue_intelligence_snapshots revenue_action_proposals settlement_events ai_model_runs ai_recommendation_feedback; do
            jq -e --arg t "$table" '[.result[].results[]?.name] | index($t) != null' <<<"$schema" >/dev/null || {
              echo "D1_SCHEMA_${table}=MISSING" >&2
              exit 50
            }
          done
          echo 'D1_SCHEMA=PASS'

  deploy-worker:
    needs: prepare-production-d1
    environment:
      name: jadeltechrd
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
      ADMIN_API_TOKEN_RAW: ${{ secrets.ADMIN_API_TOKEN }}
      AI_RUNTIME_TOKEN_RAW: ${{ secrets.AI_RUNTIME_TOKEN }}
      AI_REVENUE_SHADOW_ENABLED: ${{ vars.AI_REVENUE_SHADOW_ENABLED || 'false' }}
      AI_GATEWAY_ID_RAW: ${{ vars.AI_GATEWAY_ID }}
      AI_MODEL_RAW: ${{ vars.AI_MODEL }}
      AI_EMBEDDING_MODEL_RAW: ${{ vars.AI_EMBEDDING_MODEL }}
      AI_KNOWLEDGE_INDEX_NAME_RAW: ${{ vars.AI_KNOWLEDGE_INDEX_NAME }}
      AI_ASSETS_BUCKET_NAME_RAW: ${{ vars.AI_ASSETS_BUCKET_NAME }}
      AI_AUTOMATED_CONTROL_ENABLED_RAW: ${{ vars.AI_AUTOMATED_CONTROL_ENABLED || 'false' }}
      D1_ACCOUNT_HASH: ${{ needs.prepare-production-d1.outputs.account_hash }}
      D1_DATABASE_ID: ${{ needs.prepare-production-d1.outputs.database_id }}
      D1_DATABASE_HASH: ${{ needs.prepare-production-d1.outputs.database_hash }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Normalize Cloudflare Worker credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_API_TOKEN_RAW:-}"
          token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$token" == \"*\" && "$token" == *\" ]]; then token="${token:1:${#token}-2}"; fi
          test -n "$token" || { echo 'CLOUDFLARE_WORKER_TOKEN_PRESENT=NO' >&2; exit 2; }
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Normalize required admin credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${ADMIN_API_TOKEN_RAW:-}"
          value=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$value" == \"*\" && "$value" == *\" ]]; then value="${value:1:${#value}-2}"; fi
          test -n "$value" || { echo 'ADMIN_API_TOKEN_PRESENT=NO' >&2; exit 3; }
          test "${#value}" -ge 32 || { echo 'ADMIN_API_TOKEN_STRENGTH=FAIL_MIN_LENGTH_32' >&2; exit 3; }
          echo "::add-mask::$value"
          printf 'ADMIN_API_TOKEN=%s\n' "$value" >> "$GITHUB_ENV"
          echo 'ADMIN_API_TOKEN_PRESENT=YES'

      - name: Normalize optional AI runtime credential
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AI_REVENUE_SHADOW_ENABLED}" != "true" ]; then
            echo 'AI_REVENUE_SHADOW_ACTIVATION=DISABLED'
            exit 0
          fi
          raw="${AI_RUNTIME_TOKEN_RAW:-}"
          value=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$value" == \"*\" && "$value" == *\" ]]; then value="${value:1:${#value}-2}"; fi
          test -n "$value" || { echo 'AI_RUNTIME_TOKEN_PRESENT=NO' >&2; exit 4; }
          test "${#value}" -ge 24 || { echo 'AI_RUNTIME_TOKEN_STRENGTH=FAIL' >&2; exit 4; }
          echo "::add-mask::$value"
          printf 'AI_RUNTIME_TOKEN=%s\n' "$value" >> "$GITHUB_ENV"
          echo 'AI_RUNTIME_TOKEN_PRESENT=YES'

      - name: Resolve zone account and bind it to D1 evidence
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          zones=$(curl --fail-with-body -sS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}&status=active&per_page=50")
          test "$(jq -r '.success' <<<"$zones")" = true
          account_id=$(jq -r --arg d "$DOMAIN" '.result[] | select(.name==$d) | .account.id' <<<"$zones" | head -n1)
          test -n "$account_id" && test "$account_id" != null
          account_hash=$(printf '%s' "$account_id" | sha256sum | awk '{print $1}')
          test -n "$D1_ACCOUNT_HASH"
          if [ "$account_hash" != "$D1_ACCOUNT_HASH" ]; then
            echo "CLOUDFLARE_ACCOUNT_BINDING=FAIL worker=$account_hash d1=$D1_ACCOUNT_HASH" >&2
            exit 9
          fi
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "CLOUDFLARE_ACCOUNT_HASH=$account_hash"
          echo 'CLOUDFLARE_ACCOUNT_BINDING=PASS'

      - name: Verify existing Worker editor capability
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          code=$(curl -sS -o "$tmp" -w '%{http_code}'             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/content/v2" || true)
          if [ "$code" != 200 ]; then
            echo "WORKER_SCRIPT_EDITOR_PREFLIGHT=FAIL_HTTP_${code}" >&2
            echo 'WORKER_SCRIPT_EDITOR_REQUIRED=Workers_Scripts_Write_on_existing_jadel-commercial-runtime' >&2
            exit 10
          fi
          echo 'WORKER_SCRIPT_READ_OR_WRITE_CAPABILITY=PASS'

      - name: Capture current public Turnstile contract
        id: public
        shell: bash
        run: |
          set -euo pipefail
          headers=$(mktemp)
          body=$(curl --fail-with-body -sS -D "$headers"             -H 'Origin: https://jadeltechrd.com'             "https://${API_HOST}/api/v1/public-config")
          sitekey=$(jq -r '.turnstile_sitekey // empty' <<<"$body")
          action=$(jq -r '.turnstile_action // empty' <<<"$body")
          test -n "$sitekey"
          test "$action" = project_request
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$headers"
          echo "sitekey=$sitekey" >> "$GITHUB_OUTPUT"
          echo 'PUBLIC_TURNSTILE_CONTRACT=PASS'

      - name: Generate least-privilege Worker deployment configuration
        shell: bash
        env:
          DATABASE_ID: ${{ needs.prepare-production-d1.outputs.database_id }}
          TURNSTILE_SITEKEY: ${{ steps.public.outputs.sitekey }}
          ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_ID"
          test -n "$TURNSTILE_SITEKEY"
          test "$(printf '%s' "$DATABASE_ID" | sha256sum | awk '{print $1}')" = "$D1_DATABASE_HASH"
          jq -n --arg db "$DATABASE_ID" --arg sitekey "$TURNSTILE_SITEKEY" '{
            "$schema":"./node_modules/wrangler/config-schema.json",
            name:"jadel-commercial-runtime",
            main:"src/project-entry.mjs",
            compatibility_date:"2026-08-31",
            workers_dev:false,
            observability:{enabled:true,head_sampling_rate:1},
            vars:{
              PUBLIC_ORIGIN:"https://jadeltechrd.com",
              PUBLIC_TURNSTILE_SITEKEY:$sitekey,
              TURNSTILE_EXPECTED_HOSTNAME:"jadeltechrd.com"
            },
            d1_databases:[{
              binding:"DB",
              database_name:"jadel-commercial-runtime",
              database_id:$db
            }],
            ratelimits:[{
              name:"PROJECT_REQUEST_RATE_LIMITER",
              namespace_id:"20260831",
              simple:{limit:5,period:60}
            }],
            workflows:[{
              name:"jadel-project-lifecycle",
              binding:"PROJECT_WORKFLOW",
              class_name:"ProjectLifecycleWorkflow"
            }],
            triggers:{crons:["*/2 * * * *"]}
          }' > commercial-runtime/wrangler.deploy.jsonc
          if [ "${AI_REVENUE_SHADOW_ENABLED}" = "true" ]; then
            gateway=$(printf '%s' "${AI_GATEWAY_ID_RAW:-}" | tr -d '\r\n[:space:]')
            model=$(printf '%s' "${AI_MODEL_RAW:-}" | tr -d '\r\n[:space:]')
            embedding=$(printf '%s' "${AI_EMBEDDING_MODEL_RAW:-}" | tr -d '\r\n[:space:]')
            knowledge=$(printf '%s' "${AI_KNOWLEDGE_INDEX_NAME_RAW:-}" | tr -d '\r\n[:space:]')
            assets=$(printf '%s' "${AI_ASSETS_BUCKET_NAME_RAW:-}" | tr -d '\r\n[:space:]')
            auto=0
            [ "${AI_AUTOMATED_CONTROL_ENABLED_RAW}" = "true" ] && auto=1
            test -n "$gateway" || { echo 'AI_GATEWAY_ID=BLOCKER' >&2; exit 31; }
            test -n "$model" || { echo 'AI_MODEL=BLOCKER' >&2; exit 31; }
            test -n "$embedding" || { echo 'AI_EMBEDDING_MODEL=BLOCKER' >&2; exit 31; }
            test -n "$knowledge" || { echo 'AI_KNOWLEDGE_INDEX_NAME=BLOCKER' >&2; exit 31; }
            test -n "$assets" || { echo 'AI_ASSETS_BUCKET_NAME=BLOCKER' >&2; exit 31; }
            test -n "${AI_RUNTIME_TOKEN:-}" || { echo 'AI_RUNTIME_TOKEN=BLOCKER' >&2; exit 31; }
            test "${#GITHUB_SHA}" = 40
            tmp=$(mktemp)
            jq \
              --arg account "$ACCOUNT_ID" \
              --arg gateway "$gateway" \
              --arg model "$model" \
              --arg embedding "$embedding" \
              --arg knowledge "$knowledge" \
              --arg assets "$assets" \
              --arg sha "$GITHUB_SHA" \
              --arg auto "$auto" \
              '.vars += {
                AI_RUNTIME_MODE:"SHADOW_RECOMMEND_ONLY",
                AI_KILL_SWITCH:"0",
                CLOUDFLARE_ACCOUNT_ID:$account,
                AI_GATEWAY_ID:$gateway,
                AI_MODEL:$model,
                AI_SOURCE_SHA:$sha,
                AI_MAX_OUTPUT_TOKENS:"1200",
                AI_TIMEOUT_MS:"20000",
                AI_AUTOMATED_CONTROL_ENABLED:$auto,
                AI_AUTOMATED_CONTROL_INTERVAL_MINUTES:"360",
                AI_EMBEDDING_MODEL:$embedding
              }
              | .ai={binding:"AI"}
              | .vectorize=[{binding:"KNOWLEDGE_INDEX",index_name:$knowledge}]
              | .r2_buckets=[{binding:"AI_ASSETS",bucket_name:$assets}]
              | .ratelimits += [{
                  name:"AI_ANALYSIS_RATE_LIMITER",
                  namespace_id:"20260920",
                  simple:{limit:5,period:60}
                }]' commercial-runtime/wrangler.deploy.jsonc > "$tmp"
            mv "$tmp" commercial-runtime/wrangler.deploy.jsonc
            echo 'AI_REVENUE_SHADOW_DEPLOY_CONFIG=PASS'
          else
            echo 'AI_REVENUE_SHADOW_DEPLOY_CONFIG=DISABLED'
          fi

          jq -e 'has("routes") | not' commercial-runtime/wrangler.deploy.jsonc >/dev/null
          jq -e '.workers_dev == false' commercial-runtime/wrangler.deploy.jsonc >/dev/null
          echo 'DEPLOY_CONFIG_NO_ROUTE_MUTATION=PASS'

      - name: Install pinned Wrangler
        shell: bash
        working-directory: commercial-runtime
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts "wrangler@${WRANGLER_VERSION}"
          actual=$(npx wrangler --version | tr -d '\r\n[:space:]')
          test "$actual" = "$WRANGLER_VERSION" || { echo "WRANGLER_VERSION_MISMATCH expected=$WRANGLER_VERSION actual=$actual" >&2; exit 40; }
          echo "WRANGLER_VERSION=PASS version=${actual}"

      - name: Deploy existing Worker without route or secret mutation
        shell: bash
        working-directory: commercial-runtime
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc
          printf '%s' "$ADMIN_API_TOKEN" | npx wrangler secret put ADMIN_API_TOKEN --config wrangler.deploy.jsonc
          if [ "${AI_REVENUE_SHADOW_ENABLED}" = "true" ]; then
            test -n "${AI_RUNTIME_TOKEN:-}"
            printf '%s' "$AI_RUNTIME_TOKEN" | npx wrangler secret put AI_RUNTIME_TOKEN --config wrangler.deploy.jsonc
            echo 'AI_RUNTIME_SECRET_RECONCILED=PASS'
          fi
          echo 'WORKER_DEPLOY_NO_ROUTE_MUTATION_ADMIN_SECRET_RECONCILED=PASS'

      - name: Verify production runtime canaries
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://${API_HOST}/health"
          body=""
          for attempt in $(seq 1 18); do
            if body=$(curl --fail --silent --show-error --max-time 15 "$health_url" 2>/dev/null); then
              test "$(jq -r '.status' <<<"$body")" = ok
              test "$(jq -r '.service' <<<"$body")" = "$WORKER_NAME"
              test "$(jq -r '.write_mode' <<<"$body")" = fail-closed
              break
            fi
            sleep 5
          done
          test -n "$body" || { echo 'LIVE_HEALTH_CANARY=FAIL' >&2; exit 51; }
          echo 'LIVE_HEALTH_CANARY=PASS'

          config_headers=$(mktemp)
          config=$(curl --fail-with-body -sS -D "$config_headers" -H 'Origin: https://jadeltechrd.com'             "https://${API_HOST}/api/v1/public-config")
          test "$(jq -r '.turnstile_action' <<<"$config")" = project_request
          test -n "$(jq -r '.turnstile_sitekey' <<<"$config")"
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$config_headers"
          echo 'PUBLIC_CONFIG_CORS=PASS'

          preflight_headers=$(mktemp)
          preflight_code=$(curl -sS -o /dev/null -D "$preflight_headers" -w '%{http_code}' -X OPTIONS             -H 'Origin: https://jadeltechrd.com'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,idempotency-key'             "https://${API_HOST}/api/v1/project-requests")
          test "$preflight_code" = 204
          grep -qi '^access-control-allow-origin: https://jadeltechrd.com' "$preflight_headers"
          echo 'PUBLIC_INTAKE_PREFLIGHT=PASS'

          admin_code=$(curl -sS -o /tmp/admin.json -w '%{http_code}'             "https://${API_HOST}/api/v1/admin/approvals")
          test "$admin_code" = 401 || { echo "ADMIN_SECRET_CANARY=FAIL_HTTP_${admin_code}" >&2; cat /tmp/admin.json >&2; exit 52; }
          echo 'ADMIN_SECRET_CANARY=PASS'

          revenue_code=$(curl -sS -o /tmp/revenue.json -w '%{http_code}'             "https://${API_HOST}/api/v1/admin/revenue-intelligence")
          test "$revenue_code" = 401 || { echo "REVENUE_INTELLIGENCE_ROUTE_CANARY=FAIL_HTTP_${revenue_code}" >&2; cat /tmp/revenue.json >&2; exit 53; }
          echo 'REVENUE_INTELLIGENCE_ROUTE_CANARY=PASS'

          for ai_path in /api/v1/admin/revenue-intelligence/analyze /api/v1/admin/multimodal-qc /api/v1/admin/model-runs; do
            method=GET
            [ "$ai_path" = "/api/v1/admin/revenue-intelligence/analyze" ] && method=POST
            [ "$ai_path" = "/api/v1/admin/multimodal-qc" ] && method=POST
            ai_code=$(curl -sS -o /tmp/ai-admin.json -w '%{http_code}' -X "$method" -H 'content-type: application/json' --data '{}' "https://${API_HOST}${ai_path}")
            test "$ai_code" = 401 || { echo "AI_ADMIN_ROUTE_CANARY=FAIL path=${ai_path} http=${ai_code}" >&2; cat /tmp/ai-admin.json >&2; exit 53; }
          done
          echo 'AI_ADMIN_ROUTES_AUTH_GATE=PASS'

          if [ "${AI_REVENUE_SHADOW_ENABLED}" = "true" ]; then
            shadow=$(curl --fail-with-body -sS -H "Authorization: Bearer ${ADMIN_API_TOKEN}" "https://${API_HOST}/api/v1/admin/revenue-intelligence")
            test "$(jq -r '.ai_runtime.enabled' <<<"$shadow")" = true || {
              echo 'AI_SHADOW_RUNTIME_CONFIG=FAIL' >&2
              jq '{ai_runtime,knowledge_runtime}' <<<"$shadow" >&2
              exit 55
            }
            test "$(jq -r '.knowledge_runtime.enabled' <<<"$shadow")" = true || {
              echo 'AI_KNOWLEDGE_RUNTIME_CONFIG=FAIL' >&2
              jq '{ai_runtime,knowledge_runtime}' <<<"$shadow" >&2
              exit 55
            }
            test "$(jq -r '.production_authorized' <<<"$shadow")" = false
            echo 'AI_SHADOW_RUNTIME_CONFIG=PASS inference_not_executed'
          else
            echo 'AI_SHADOW_RUNTIME_CONFIG=DISABLED'
          fi

          paypal_code=$(curl -sS -o /tmp/paypal.json -w '%{http_code}'             -X POST -H 'content-type: application/json' --data '{}'             "https://${API_HOST}/api/v1/paypal/webhooks")
          if [ "$paypal_code" = 403 ]; then
            echo 'PAYPAL_SECRET_CANARY=PASS_CONFIGURED_REJECTS_INVALID_SIGNATURE'
          elif [ "$paypal_code" = 503 ] && [ "$(jq -r '.error // empty' /tmp/paypal.json)" = "PAYPAL_WEBHOOK_NOT_CONFIGURED" ]; then
            echo 'PAYPAL_SECRET_CANARY=PASS_DISABLED_FAIL_CLOSED'
          else
            echo "PAYPAL_SECRET_CANARY=FAIL_HTTP_${paypal_code}" >&2
            cat /tmp/paypal.json >&2
            exit 54
          fi
          echo 'COMMERCIAL_RUNTIME_PRODUCTION_CANARY=PASS'
