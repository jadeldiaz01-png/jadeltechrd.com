name: Pages origin vs edge bridge diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pages-origin-edge-bridge-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare deployed paths
        shell: bash
        run: |
          set -euo pipefail
          expected='const grid = document.getElementById("services-grid")'

          check_url() {
            label="$1"
            url="$2"
            file="/tmp/${label}.js"
            headers="/tmp/${label}.headers"
            code=$(curl -sSL -D "$headers" -o "$file" -w '%{http_code}' "$url" || true)
            echo "${label}_HTTP=${code}"
            if [ "$code" = 200 ]; then
              echo "${label}_SHA256=$(sha256sum "$file" | awk '{print $1}')"
              if grep -Fq "$expected" "$file" && ! grep -Fq 'pointermove' "$file" && ! grep -Fq 'event.stopPropagation()' "$file"; then
                echo "${label}_FINGERPRINT=FIXED"
              else
                echo "${label}_FINGERPRINT=STALE_OR_OTHER"
              fi
              grep -Ei '^(HTTP/|age:|cache-control:|cf-cache-status:|etag:|last-modified:|server:|location:|x-github-request-id:)' "$headers" || true
            fi
          }

          check_url EDGE_ROOT "https://jadeltechrd.com/project-intake-bridge.js?diag=${GITHUB_RUN_ID}"
          check_url EDGE_PROJECT_PATH "https://jadeltechrd.com/jadeltechrd.com/project-intake-bridge.js?diag=${GITHUB_RUN_ID}"
          check_url GITHUB_IO_PROJECT "https://jadeldiaz01-png.github.io/jadeltechrd.com/project-intake-bridge.js?diag=${GITHUB_RUN_ID}"
          check_url GITHUB_IO_ROOT "https://jadeldiaz01-png.github.io/project-intake-bridge.js?diag=${GITHUB_RUN_ID}"

          echo 'DIAG_COMPLETE=YES'
