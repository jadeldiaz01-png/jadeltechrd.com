name: Bootstrap VPS GitHub Runner over Tailscale

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main SHA authorized for runner bootstrap
        required: true
        type: string
      confirmation:
        description: Type REGISTER_JADEL_AGENT_RUNTIME_TAILSCALE
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-jadel-agent-runtime-tailscale
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirmation == 'REGISTER_JADEL_AGENT_RUNTIME_TAILSCALE'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-bootstrap
    env:
      TARGET_RUNNER_NAME: jadel-agent-runtime
      TARGET_RUNNER_LABELS: jadel-agent-runtime
      VPS_TAILSCALE_HOST: ${{ vars.VPS_TAILSCALE_HOST }}
      VPS_TAILSCALE_IP: ${{ vars.VPS_TAILSCALE_IP }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_PRIVATE_KEY_PASSPHRASE }}
      VPS_TAILSCALE_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TAILSCALE_SSH_KNOWN_HOSTS }}
      RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN }}
      TS_DEPLOYER_OAUTH_ID: ${{ secrets.TS_DEPLOYER_OAUTH_ID }}
      TS_DEPLOYER_AUDIENCE: ${{ secrets.TS_DEPLOYER_AUDIENCE }}

    steps:
      - name: Enforce exact-SHA authorization
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          echo 'EXACT_MAIN_SHA=PASS'

      - name: Fail closed when Tailscale bootstrap inputs are missing
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_TAILSCALE_HOST VPS_TAILSCALE_IP VPS_USER VPS_SSH_PRIVATE_KEY VPS_SSH_PRIVATE_KEY_PASSPHRASE VPS_TAILSCALE_SSH_KNOWN_HOSTS RUNNER_ADMIN_TOKEN TS_DEPLOYER_OAUTH_ID TS_DEPLOYER_AUDIENCE; do
            if [ -z "${!name:-}" ]; then
              echo "MISSING_INPUT=$name"
              missing=1
            fi
          done
          test "$missing" -eq 0
          [[ "$VPS_TAILSCALE_IP" =~ ^100\. ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          case "$VPS_USER" in root) echo 'refusing root SSH user' >&2; exit 1;; esac
          echo 'TAILSCALE_BOOTSTRAP_INPUTS=PASS'

      - name: Checkout exact bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove immutable checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f ops/runner/bootstrap-self-hosted-runner.sh
          echo 'IMMUTABLE_BOOTSTRAP_SOURCE=PASS'

      - name: Join private tailnet
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888
        with:
          oauth-client-id: ${{ secrets.TS_DEPLOYER_OAUTH_ID }}
          audience: ${{ secrets.TS_DEPLOYER_AUDIENCE }}
          tags: tag:github-deployer
          ping: ${{ vars.VPS_TAILSCALE_HOST }}

      - name: Verify private VPS path
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=15s "$VPS_TAILSCALE_HOST"
          python3 - <<'PY'
          import os, socket
          host = os.environ["VPS_TAILSCALE_IP"]
          with socket.create_connection((host, 22), timeout=10):
              print("TAILSCALE_TCP_22=PASS")
          PY

      - name: Prepare pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_TAILSCALE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -l -f "$HOME/.ssh/id_ed25519" >/dev/null
          test -s "$HOME/.ssh/known_hosts"

          eval "$(ssh-agent -s)" >/dev/null
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"

          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY_PASSPHRASE:?}"
          ASKPASS
          chmod 0700 "$askpass"

          DISPLAY=:0 SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force \
            ssh-add "$HOME/.ssh/id_ed25519" </dev/null >/dev/null

          expected_fp="$(ssh-keygen -lf "$HOME/.ssh/id_ed25519" -E sha256 | awk '{print $2}')"
          ssh-add -l -E sha256 | awk '{print $2}' | grep -Fxq "$expected_fp"
          rm -f "$askpass"
          trap - EXIT
          echo 'SSH_TRUST_MATERIAL=PASS'

      - name: Obtain ephemeral GitHub runner registration token
        id: github_runner
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com'
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10')

          token_json="$(curl -fsS -X POST "${auth[@]}" "$api/repos/$GITHUB_REPOSITORY/actions/runners/registration-token")"
          reg_token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<<"$token_json")"
          test -n "$reg_token"
          echo "::add-mask::$reg_token"

          downloads="$(curl -fsS "${auth[@]}" "$api/repos/$GITHUB_REPOSITORY/actions/runners/downloads")"
          selection="$(python3 -c 'import json,sys; a=[x for x in json.load(sys.stdin) if x.get("os")=="linux" and x.get("architecture")=="x64"]; assert a, "no linux-x64 runner artifact"; x=a[0]; print(x["download_url"]); print(x["sha256_checksum"])' <<<"$downloads")"
          runner_url="$(sed -n '1p' <<<"$selection")"
          runner_sha="$(sed -n '2p' <<<"$selection")"
          [[ "$runner_sha" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$runner_url" == https://github.com/* || "$runner_url" == https://objects.githubusercontent.com/* ]]

          {
            echo "reg_token=$reg_token"
            echo "runner_url=$runner_url"
            echo "runner_sha=$runner_sha"
          } >> "$GITHUB_OUTPUT"
          echo 'GITHUB_RUNNER_EPHEMERAL_TOKEN=PASS'

      - name: Register and start runner on VPS through Tailscale
        shell: bash
        env:
          REG_TOKEN: ${{ steps.github_runner.outputs.reg_token }}
          RUNNER_URL: ${{ steps.github_runner.outputs.runner_url }}
          RUNNER_SHA: ${{ steps.github_runner.outputs.runner_sha }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o IdentityAgent="$SSH_AUTH_SOCK" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -- "$VPS_USER@$VPS_TAILSCALE_HOST" \
            "sudo -n env RUNNER_REG_TOKEN='$REG_TOKEN' RUNNER_DOWNLOAD_URL='$RUNNER_URL' RUNNER_SHA256='$RUNNER_SHA' RUNNER_NAME='$TARGET_RUNNER_NAME' RUNNER_LABELS='$TARGET_RUNNER_LABELS' REPO_URL='https://github.com/$GITHUB_REPOSITORY' bash -s" \
            < ops/runner/bootstrap-self-hosted-runner.sh

      - name: Verify runner online and idle
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.github.com'
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $RUNNER_ADMIN_TOKEN" -H 'X-GitHub-Api-Version: 2026-03-10')
          for attempt in $(seq 1 12); do
            runners="$(curl -fsS "${auth[@]}" "$api/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100")"
            state="$(python3 -c 'import json,sys; name=sys.argv[1]; data=json.load(sys.stdin); found=next((r for r in data.get("runners",[]) if r.get("name")==name),None); required={"self-hosted","linux","x64","jadel-agent-runtime"}; labels={x.get("name","").lower() for x in (found or {}).get("labels",[])}; print("MISSING" if found is None else ("READY" if found.get("status")=="online" and found.get("busy") is False and required.issubset(labels) else "NOT_READY:%s:%s"%(found.get("status"),found.get("busy"))))' "$TARGET_RUNNER_NAME" <<<"$runners")"
            echo "RUNNER_STATE_ATTEMPT_${attempt}=$state"
            if [ "$state" = READY ]; then
              echo 'RUNNER_READY=PASS'
              exit 0
            fi
            sleep 5
          done
          echo 'RUNNER_READY=FAIL'
          exit 30

      - name: Cleanup ephemeral SSH material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null 2>&1 || true
          fi
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
