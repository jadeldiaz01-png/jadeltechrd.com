name: Deploy Cloudflare Free Managed WAF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-free-waf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-free-waf:
    environment:
      name: jadeltechrd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: jadeltechrd.com
      # Cloudflare official Free Managed Ruleset ID, documented in cloudflare-docs.
      FREE_MANAGED_RULESET_ID: 77454fe2d30c4220b5701f6fdfb893ba
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN }}
    steps:
      - name: Resolve active zone with least privilege
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_API_TOKEN_RAW:-}"
          token=$(printf '%s' "$raw" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')
          if [[ "$token" == \"*\" && "$token" == *\" ]]; then token="${token:1:${#token}-2}"; fi
          if [ -z "$token" ]; then echo 'CLOUDFLARE_TOKEN_PRESENT=NO'; exit 2; fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          auth=(-H "Authorization: Bearer ${token}" -H 'Content-Type: application/json')

          zone_json=$(mktemp)
          code=$(curl -sS -o "$zone_json" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}&status=active&per_page=50" || true)
          if [ "$code" != 200 ]; then
            echo "CLOUDFLARE_ZONE_LOOKUP=FAILED_HTTP_${code}"
            jq -r '.errors[]? | "Cloudflare error code=\(.code) message=\(.message)"' "$zone_json" || true
            exit 10
          fi
          zone_id=$(jq -r --arg d "$DOMAIN" '.result[] | select(.name==$d) | .id' "$zone_json" | head -n1)
          test -n "$zone_id" && test "$zone_id" != null
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo 'CLOUDFLARE_ZONE_ACCESS=PASS'
          echo 'FREE_MANAGED_RULESET_ID_SOURCE=OFFICIAL_CLOUDFLARE_DOCS'

      - name: Deploy Free Managed Ruleset idempotently at zone level
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          entry=$(mktemp)
          code=$(curl -sS -o "$entry" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_firewall_managed/entrypoint" || true)

          if [ "$code" = 200 ]; then
            if jq -e --arg id "$FREE_MANAGED_RULESET_ID" '.result.rules[]? | select(.action=="execute" and .action_parameters.id==$id and (.enabled // true)==true)' "$entry" >/dev/null; then
              echo 'FREE_MANAGED_WAF_ALREADY_DEPLOYED=YES'
              exit 0
            fi
            entry_id=$(jq -r '.result.id' "$entry")
            test -n "$entry_id" && test "$entry_id" != null
            out=$(mktemp)
            rc=$(curl -sS -o "$out" -w '%{http_code}' --request POST "${auth[@]}" \
              --data "$(jq -n --arg id "$FREE_MANAGED_RULESET_ID" '{action:"execute",action_parameters:{id:$id},expression:"true",description:"Execute Cloudflare Free Managed Ruleset for Jadel Tech RD",ref:"jadel_free_managed_waf_v2",enabled:true}')" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/${entry_id}/rules" || true)
          elif [ "$code" = 404 ]; then
            out=$(mktemp)
            payload=$(jq -n --arg id "$FREE_MANAGED_RULESET_ID" '{name:"Jadel Tech RD managed WAF",description:"Zone entry point for Cloudflare Free Managed Ruleset",kind:"zone",phase:"http_request_firewall_managed",rules:[{action:"execute",action_parameters:{id:$id},expression:"true",description:"Execute Cloudflare Free Managed Ruleset for Jadel Tech RD",ref:"jadel_free_managed_waf_v2",enabled:true}]}')
            rc=$(curl -sS -o "$out" -w '%{http_code}' --request POST "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets" || true)
          elif [ "$code" = 403 ]; then
            echo 'FREE_MANAGED_WAF_READ=PERMISSION_BLOCKED'
            echo 'REQUIRED_CONTROL=Zone WAF Read/Edit (least privilege)'
            exit 20
          else
            echo "MANAGED_PHASE_READ=FAILED_HTTP_${code}"
            exit 21
          fi

          if [ "$rc" != 200 ]; then
            echo "FREE_MANAGED_WAF_DEPLOY=FAILED_HTTP_${rc}"
            jq -r '.errors[]? | "Cloudflare error code=\(.code) message=\(.message)"' "$out" || true
            if [ "$rc" = 403 ]; then echo 'REQUIRED_CONTROL=Zone WAF Edit'; fi
            exit 22
          fi
          test "$(jq -r '.success' "$out")" = true
          echo 'FREE_MANAGED_WAF_DEPLOY=PASS'

      - name: Verify WAF deployment and public site health
        shell: bash
        env:
          ZONE_ID: ${{ steps.cf.outputs.zone_id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          entry=$(mktemp)
          code=$(curl -sS -o "$entry" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/rulesets/phases/http_request_firewall_managed/entrypoint" || true)
          test "$code" = 200
          jq -e --arg id "$FREE_MANAGED_RULESET_ID" '.result.rules[]? | select(.action=="execute" and .action_parameters.id==$id and (.enabled // true)==true)' "$entry" >/dev/null
          echo 'FREE_MANAGED_WAF_VERIFY=PASS'

          for url in "https://${DOMAIN}/" "https://${DOMAIN}/?view=privacy" "https://${DOMAIN}/?view=terms" "https://${DOMAIN}/?view=data-deletion"; do
            status=$(curl --silent --show-error --location --output /tmp/body --write-out '%{http_code}' --proto '=https' --tlsv1.2 "$url")
            echo "$url -> HTTP=$status"
            test "$status" = 200
            test -s /tmp/body
          done
          echo 'POST_WAF_SITE_HEALTH=PASS'
