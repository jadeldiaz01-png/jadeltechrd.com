name: Diagnose AGIA Service Once

on:
  push:
    branches:
      - 'ops/diagnose-agia-service-72c3b3fb'
    paths:
      - '.github/workflows/diagnose-agia-service-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose AGIA service and API
    runs-on: [self-hosted, linux, x64, jadel-agent-runtime]
    timeout-minutes: 6
    environment: production-bootstrap
    env:
      EXPECTED_MAIN: '72c3b3fb183a988c59de3d5af54484c6c6e0db26'
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_PRIVATE_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_PRIVATE_KEY_PASSPHRASE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Exact lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/diagnose-agia-service-once.yml'

      - name: Prepare self Tailscale SSH
        shell: bash
        run: |
          set -euo pipefail
          TAILSCALE_IP="$(tailscale ip -4 | head -n1)"
          printf 'TAILSCALE_IP=%s\n' "$TAILSCALE_IP" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519"
          awk -v host="$TAILSCALE_IP" '{print host" "$1" "$2}' /etc/ssh/ssh_host_ed25519_key.pub > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/known_hosts"
          eval "$(ssh-agent -s)" >/dev/null
          printf 'SSH_AUTH_SOCK=%s\n' "$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          printf 'SSH_AGENT_PID=%s\n' "$SSH_AGENT_PID" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/ssh/askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY_PASSPHRASE:?}"
          ASKPASS
          chmod 0700 "$RUNNER_TEMP/ssh/askpass"
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/ssh/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$RUNNER_TEMP/ssh/id_ed25519" </dev/null >/dev/null

      - name: Read-only diagnosis
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent="$SSH_AUTH_SOCK" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=15)
          "${SSH[@]}" -- "$VPS_USER@$TAILSCALE_IP" 'bash -s' <<'REMOTE'
          set +e
          home=/opt/actions-runners/agia-production-certifier
          for f in .runner .credentials .credentials_rsaparams .service; do
            if [ -s "$home/$f" ]; then
              echo "FILE_${f#.}=PRESENT"
            elif [ -e "$home/$f" ]; then
              echo "FILE_${f#.}=EMPTY_OR_NONREGULAR"
            else
              echo "FILE_${f#.}=ABSENT"
            fi
          done

          service=""
          if [ -s "$home/.service" ]; then
            service="$(cat "$home/.service")"
            echo "SERVICE_NAME_PRESENT=YES"
            systemctl is-enabled "$service" 2>/dev/null | sed 's/^/SERVICE_ENABLED_STATE=/' || echo "SERVICE_ENABLED_STATE=ERROR"
            systemctl is-active "$service" 2>/dev/null | sed 's/^/SERVICE_ACTIVE_STATE=/' || echo "SERVICE_ACTIVE_STATE=ERROR"
            systemctl show "$service" -p MainPID --value 2>/dev/null | sed 's/^/SERVICE_MAINPID=/'
          else
            echo "SERVICE_NAME_PRESENT=NO"
          fi

          if pgrep -af '/opt/actions-runners/agia-production-certifier/.*Runner' >/dev/null 2>&1; then
            echo "DEDICATED_RUNNER_PROCESS=PASS"
          elif pgrep -af 'RunnerService.js' | grep -F '/opt/actions-runners/agia-production-certifier' >/dev/null 2>&1; then
            echo "DEDICATED_RUNNER_PROCESS=PASS"
          else
            echo "DEDICATED_RUNNER_PROCESS=NOT_MATCHED"
          fi

          legacy="$(cat /opt/actions-runner/.service 2>/dev/null)"
          if [ "$legacy" = "actions.runner.jadeldiaz01-png-jadeltechrd.com.jadel-agent-runtime.service" ]; then
            echo "JADEL_SERVICE_MARKER=PASS"
          else
            echo "JADEL_SERVICE_MARKER=FAIL"
          fi
          systemctl is-active "$legacy" 2>/dev/null | sed 's/^/JADEL_SERVICE_ACTIVE_STATE=/' || true

          if [ -e /opt/actions-runners/p4h-runtime/.runner ]; then
            echo "P4H_HASH=$(sha256sum /opt/actions-runners/p4h-runtime/.runner | awk '{print $1}')"
          else
            echo "P4H_HASH=ABSENT"
          fi

          T="$(sudo -n /usr/local/sbin/agia-github-app-installation-token print-installation-token 2>/dev/null)"
          trc=$?
          if [ "$trc" -ne 0 ] || [ -z "$T" ]; then
            echo "GITHUB_APP_HELPER_STATUS=FAIL"
            exit 0
          fi
          echo "GITHUB_APP_HELPER_STATUS=PASS"
          DATA="$(curl -fsS -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/jadeldiaz01-png/universal-multi-project-runtime/actions/runners?per_page=100")"
          unset T
          python3 -c 'import json,sys,socket; d=json.load(sys.stdin); n=socket.gethostname().split(".")[0]+"-agia-production-certifier"; r=next((x for x in d.get("runners",[]) if x.get("name")==n),None); print("AGIA_API_PRESENT="+("YES" if r else "NO")); print("AGIA_API_STATUS="+str((r or {}).get("status"))); print("AGIA_API_BUSY="+str((r or {}).get("busy")).lower()); print("AGIA_API_LABEL="+("YES" if r and "agia-production-certifier" in {x.get("name") for x in r.get("labels",[])} else "NO"))' <<<"$DATA"
          REMOTE

      - name: Cleanup
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
          rm -rf "$RUNNER_TEMP/ssh"
