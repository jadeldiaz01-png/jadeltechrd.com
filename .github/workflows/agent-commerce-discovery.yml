name: agent-commerce-discovery

on:
  pull_request:
    paths:
      - 'llms.txt'
      - 'agent-services.json'
      - 'docs/AGENT-COMMERCE-DISCOVERY-2026.md'
      - 'commercial-runtime/src/service-pricing.mjs'
      - 'commercial-runtime/src/offer-catalog.mjs'
      - 'scripts/validate-agent-commerce-discovery.mjs'
      - '.github/workflows/agent-commerce-discovery.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'llms.txt'
      - 'agent-services.json'
      - 'docs/AGENT-COMMERCE-DISCOVERY-2026.md'
      - 'commercial-runtime/src/service-pricing.mjs'
      - 'commercial-runtime/src/offer-catalog.mjs'
      - 'scripts/validate-agent-commerce-discovery.mjs'
      - '.github/workflows/agent-commerce-discovery.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - name: Validate agent commerce discovery
        run: node scripts/validate-agent-commerce-discovery.mjs

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('agent-services.json','utf8'))"
