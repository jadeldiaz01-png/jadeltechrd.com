name: Live add-agent regression

on:
  workflow_run:
    workflows: ["Deploy public site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-add-controls:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE: https://jadeltechrd.com
      PUPPETEER_VERSION: 25.9.0
    steps:
      - name: Wait for deployed bridge fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "$SITE/project-intake-bridge.js" --output /tmp/live-bridge.js
            if grep -Fq 'const grid = document.getElementById("services-grid")' /tmp/live-bridge.js \
              && ! grep -Fq 'pointermove' /tmp/live-bridge.js \
              && ! grep -Fq 'event.stopPropagation()' /tmp/live-bridge.js; then
              echo "LIVE_BRIDGE_FINGERPRINT=PASS attempt=${attempt}"
              break
            fi
            echo "LIVE_BRIDGE_FINGERPRINT=STALE attempt=${attempt}"
            if [ "$attempt" -eq 12 ]; then
              echo 'LIVE_BRIDGE_FINGERPRINT=FAIL'
              exit 5
            fi
            sleep 5
          done

      - name: Install pinned Puppeteer and Chrome
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-add-agent-regression"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-exact "puppeteer@${PUPPETEER_VERSION}"
          npx puppeteer browsers install chrome
          test "$(node -p "require('puppeteer/package.json').version")" = "$PUPPETEER_VERSION"

      - name: Click every deployed Add control on Android-sized viewport
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/live-add-agent-regression"
          SITE="$SITE" node <<'NODE'
          const puppeteer = require('puppeteer');
          const assert = require('node:assert/strict');

          async function clickWithin(page, selector, ms = 3000) {
            let timer;
            try {
              return await Promise.race([
                page.click(selector).then(() => true),
                new Promise(resolve => { timer = setTimeout(() => resolve(false), ms); }),
              ]);
            } finally {
              clearTimeout(timer);
            }
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              protocolTimeout: 30000,
              args: ['--no-sandbox', '--disable-gpu', '--disable-dev-shm-usage'],
            });
            try {
              const page = await browser.newPage();
              page.setDefaultTimeout(8000);
              await page.setViewport({ width: 412, height: 915, deviceScaleFactor: 2.625, isMobile: true, hasTouch: true });
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));

              await page.setCacheEnabled(false);
              await page.goto(process.env.SITE, { waitUntil: 'domcontentloaded', timeout: 20000 });
              await page.waitForSelector('[data-add-service="architecture"]', { visible: true });
              await new Promise(resolve => setTimeout(resolve, 500));

              const ids = await page.$$eval('[data-add-service]', nodes => nodes.map(node => node.getAttribute('data-add-service')));
              assert.deepEqual(ids, ['architecture','support','sales','social','cineforge','meta','analytics','revenue','quant','governance','multiagent']);

              for (let index = 0; index < ids.length; index += 1) {
                const id = ids[index];
                const selector = `[data-add-service="${id}"]`;
                await page.evaluate(sel => document.querySelector(sel)?.scrollIntoView({ block: 'center' }), selector);
                const before = await page.$$eval('[data-remove-service]', nodes => nodes.length);
                const started = Date.now();
                assert.equal(await clickWithin(page, selector), true, `${id}: deployed Add control froze`);
                await page.waitForFunction(expected => document.querySelectorAll('[data-remove-service]').length === expected, {}, before + 1);

                const expectedServices = ids.slice(0, Math.min(index + 1, 8));
                await page.waitForFunction((expected) => {
                  const node = document.querySelector('#request-payment');
                  if (node?.dataset.governedIntake !== 'true') return false;
                  const url = new URL(node.getAttribute('href'), window.location.origin);
                  return url.origin === window.location.origin &&
                    url.pathname === '/solicitar-proyecto.html' &&
                    url.searchParams.get('services') === expected.join(',');
                }, { timeout: 2000 }, expectedServices);

                const elapsed = Date.now() - started;
                assert.ok(elapsed < 3000, `${id}: interaction latency exceeded 3 seconds`);
                console.log(`LIVE_${id}_ADD_MS=${elapsed}`);
              }

              assert.deepEqual(pageErrors, [], `page errors: ${pageErrors.join(' | ')}`);
              console.log('LIVE_ALL_11_ADD_CONTROLS=PASS');
              console.log('LIVE_GOVERNED_INTAKE_ROUTING=PASS');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error?.stack || error);
            process.exit(1);
          });
          NODE
