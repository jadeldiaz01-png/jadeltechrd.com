name: jadel-agent-fleet

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    mem_limit: 192m
    cpus: 0.50
    networks: [fleet]

  support-tickets:
    build:
      context: ${JADEL_SOURCES_DIR:-/opt/jadel-agent-fleet/sources}/support-tickets
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8501:8501"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /home/appuser:rw,nosuid,nodev,size=32m
    mem_limit: 512m
    cpus: 1.00
    networks: [fleet]

  chatbot:
    profiles: ["chatbot"]
    build:
      context: ${JADEL_SOURCES_DIR:-/opt/jadel-agent-fleet/sources}/chatbot
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be supplied server-side}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    ports:
      - "127.0.0.1:8502:8501"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /home/appuser:rw,nosuid,nodev,size=32m
    mem_limit: 768m
    cpus: 1.00
    networks: [fleet]

  aureus:
    build:
      context: ${JADEL_SOURCES_DIR:-/opt/jadel-agent-fleet/sources}/aureus
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    mem_limit: 512m
    cpus: 1.00
    networks: [fleet]

networks:
  fleet:
    driver: bridge
